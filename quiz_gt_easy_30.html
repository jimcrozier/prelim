<script>
const quiz = [
{ type: "micro", topic: "Strategy definition",
  q: "In extensive-form game theory, a <b>strategy</b> for a player is best defined as:",
  opts: ["A complete contingent plan specifying an action at every information set where the player moves.", "The single action the player takes at his first decision node.", "Any probability distribution over pure actions, randomizing to keep the opponent from exploiting predictable play.", "The sequence of actions the player actually takes along the equilibrium path, representing only the realized history of moves."],
  correct: 0,
  explain: "<span class=\"verdict\">A strategy is a complete contingent plan — it must specify actions everywhere, even off-path.</span>\nThe key word is <i>complete</i>: off-path actions matter for checking credibility in SPNE. Picking only the on-path action is insufficient; a mixed strategy is one special case, not the definition of strategy itself.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Dominant strategy",
  q: "Strategy $s_i$ is a <b>strictly dominant</b> strategy for player $i$ if:",
  opts: ["It is the best response to the opponent's Nash equilibrium strategy, ensuring no unilateral deviation is profitable given that specific profile.", "It strictly outperforms every other strategy regardless of what opponents play.", "No opponent has an incentive to deviate from it.", "It maximizes the sum of all players' payoffs, producing the socially efficient outcome no matter what opponents choose."],
  correct: 1,
  explain: "<span class=\"verdict\">Strict dominance means strictly better regardless of what opponents do.</span>\nThe definition is unconditional: $u_i(s_i, s_{-i}) \\gt u_i(s_i', s_{-i})$ for all $s_{-i}$. Being a best response only to a Nash strategy is a much weaker condition. Maximizing the social sum is a social-planner concept, not an individual dominance concept.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "IDSDS and dominated strategies",
  q: "After one round of deleting strictly dominated strategies, a remaining strategy is guaranteed to be:",
  opts: ["A Nash equilibrium strategy.", "A strictly dominant strategy — it outperforms all alternatives in every contingency, the strongest rationalizability concept.", "A best response to at least one belief over opponents' strategies.", "The unique survivor of iterated deletion, implying all other strategies have been fully eliminated from consideration."],
  correct: 2,
  explain: "<span class=\"verdict\">A strategy survives strict-dominance deletion if and only if it is a best response to some belief — these two concepts are equivalent.</span>\nA strictly dominated strategy is never a best response to any belief, so survivors are always best responses to something. A surviving strategy need not be dominant or a NE strategy — those are stronger requirements. Iterated deletion may leave multiple strategies.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Nash equilibrium definition",
  q: "A strategy profile $(s_1^*, s_2^*)$ is a <b>Nash equilibrium</b> if and only if:",
  opts: ["Both players receive the highest possible total payoff.", "No player has a strictly dominant strategy.", "Both players play mixed strategies that make the opponent indifferent.", "Each player's strategy is a best response to the other player's strategy."],
  correct: 3,
  explain: "<span class=\"verdict\">Nash equilibrium: mutual best responses — no one wants to deviate given what the other is doing.</span>\nNE does not require maximum total payoffs (the prisoner's dilemma NE is inefficient). Players need not be indifferent; that describes a mixed NE specifically, not NE in general. The absence of dominant strategies is a different condition unrelated to the NE definition.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Best response and mixed NE",
  q: "In a mixed-strategy Nash equilibrium, player $i$'s mixing probabilities are pinned down by:",
  opts: ["Maximizing $i$'s own expected payoff over the mixing probability.", "The condition that the opponent is indifferent across all strategies in the opponent's mixing support.", "The requirement that $i$ strictly prefers one strategy but randomizes to prevent the opponent from exploiting a predictable pattern of play.", "The condition that both players receive equal expected payoffs, so neither has an incentive to adjust the mixing probability."],
  correct: 1,
  explain: "<span class=\"verdict\">Your mix makes your <i>opponent</i> indifferent — that is what pins down your mixing probability.</span>\nPlayer $i$'s mixing probabilities are chosen so that the opponent is exactly indifferent; otherwise the opponent would not mix. Player $i$ must personally be indifferent too — but the numerical probabilities are solved from the opponent's indifference condition. The guide lists this explicitly in the deduction list.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Reading a payoff matrix — prisoner's dilemma NE",
  q: "Find the unique pure-strategy Nash equilibrium in the game below (Row player's payoff listed first).<br><br><table><tr><th></th><th>C</th><th>D</th></tr><tr><th>A</th><td>3, 3</td><td>0, 4</td></tr><tr><th>B</th><td>4, 0</td><td>1, 1</td></tr></table>",
  opts: ["(A, C) only.", "(A, C) and (B, D).", "There are no pure-strategy Nash equilibria.", "(B, D) only."],
  correct: 3,
  explain: "<span class=\"verdict\">(B, D) is the unique pure NE — the dominant-strategy outcome of this prisoner's dilemma.</span>\nAt (B, D): Row gets 1; switching to A gives 0 — no gain. Column gets 1; switching to C gives 0 — no gain. At (A, C): Row prefers B (4 vs 3), so (A, C) fails the NE check. Defect (B or D) strictly dominates for each player.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Prisoner's dilemma structure",
  q: "The prisoner's dilemma is a game in which the unique NE is Pareto inferior because:",
  opts: ["Defect strictly dominates cooperate for each player, making mutual defection the unique NE.", "Both players prefer to randomize rather than commit to a pure strategy, since the symmetric payoff structure makes mixing uniquely stable.", "Cooperation is a Nash equilibrium in the augmented game with cheap talk, but players irrationally choose to defect due to strategic uncertainty.", "The game has no pure-strategy Nash equilibrium."],
  correct: 0,
  explain: "<span class=\"verdict\">Defect strictly dominates cooperate for each player, yielding a NE that both rank below mutual cooperation.</span>\nBecause defect is strictly dominant, IDSDS pins down mutual defection as the unique NE. Mutual cooperation gives higher payoffs to both but is not a NE — each player would want to deviate to defect. There is no mixing issue; dominant strategies remove all ambiguity.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Coordination game / Battle of the Sexes",
  q: "A <b>Battle of the Sexes</b>-style coordination game is distinguished from a prisoner's dilemma because:",
  opts: ["It has a unique Nash equilibrium achieved by dominant strategies, whereas the prisoner's dilemma outcome is inefficient due to iterated deletion.", "One player has a strictly dominant strategy and the other player has no dominant strategy, creating an asymmetric rationalizability structure.", "The socially optimal outcome is never a Nash equilibrium, and no trigger strategy can sustain it in the infinitely repeated version.", "There are multiple pure Nash equilibria with conflicting player preferences, but both prefer coordinating on any pure NE to miscoordinating."],
  correct: 3,
  explain: "<span class=\"verdict\">Coordination games have multiple pure NE and a selection conflict, not a cooperation conflict.</span>\nIn Battle of the Sexes there are two pure NE and a mixed NE; both players prefer either pure NE to miscoordinating. The prisoner's dilemma has a unique pure NE. In coordination games neither player has a strictly dominant strategy.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Zero-sum games",
  q: "In a <b>zero-sum</b> two-player game:",
  opts: ["One player's gain equals the other's loss in every outcome — the payoff sum is always zero, ruling out joint gains.", "Both players can simultaneously gain by coordinating on a high-payoff cell, since zero-sum only restricts competitive moves.", "There is always a strictly dominant strategy for at least one player, enabling iterated deletion to resolve the equilibrium uniquely.", "Mixed strategy equilibria do not exist."],
  correct: 0,
  explain: "<span class=\"verdict\">Zero-sum means $u_1 + u_2 = 0$ in every cell — pure conflict, no joint gains possible.</span>\nZero-sum rules out mutual gains, so coordination is impossible. Dominant strategies need not exist (e.g., matching pennies has none). Mixed strategy NE always exist in finite games by Nash's theorem, including zero-sum games like matching pennies.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Backward induction",
  q: "Backward induction in a finite game of perfect information works by:",
  opts: ["Starting from the first mover and tracing the optimal path forward.", "Assigning beliefs at every information set and checking sequential rationality, which is how PBE constructs equilibria in games of imperfect information.", "Identifying all Nash equilibria of the normal form and selecting the payoff-dominant one using standard refinement criteria.", "Starting at terminal nodes and folding optimal payoffs back toward the root, replacing each final subgame with its equilibrium value."],
  correct: 3,
  explain: "<span class=\"verdict\">Backward induction solves from the end of the tree toward the beginning.</span>\nYou start at the last decision nodes, determine the optimal action, replace the subgame with that payoff, and repeat. This is distinct from belief assignment (which describes PBE). The resulting strategy profile is an SPNE by construction.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "SPNE vs NE — credible threats",
  q: "A Nash equilibrium that is <b>not</b> a Subgame Perfect NE is characterized by:",
  opts: ["A non-credible threat — a strategy that would not be optimal to carry out in some proper subgame.", "The use of mixed strategies in at least one information set, which undermines the pure-action optimality required for subgame perfection.", "An absence of any NE in the normal form.", "Multiple players receiving precisely equal payoffs in every subgame, which prevents players from using asymmetric threats to enforce off-path discipline."],
  correct: 0,
  explain: "<span class=\"verdict\">NE can rely on off-path threats the player would never carry out — SPNE rules those out by requiring optimality in every subgame.</span>\nClassic example: an employer threatens to reject all offers. This deters low wages on path but the employer would accept a profitable offer off path — the threat is non-credible. The guide: \"name the subgame where the threat breaks\" earns the point.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Extensive form and information sets",
  q: "An <b>information set</b> in an extensive-form game is a collection of decision nodes where:",
  opts: ["The player moving there has already observed all previous actions, so each node is a singleton information set — the perfect-information benchmark.", "The player moving there cannot distinguish among those nodes based on available information.", "Multiple players must move simultaneously at each node in the set, creating a coordination structure internal to the information set.", "The payoffs at every node in the set are identical."],
  correct: 1,
  explain: "<span class=\"verdict\">An information set groups nodes the player cannot tell apart — she knows she is at one of them but not which.</span>\nIf a player could distinguish all nodes, each would be a singleton information set (perfect information). The extensive form adds this tree structure — timing, sequencing, and information sets — which the normal-form payoff matrix loses. Payoffs need not match across nodes in the set.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Incomplete information and Bayesian types",
  q: "In a <b>Bayesian game</b> of incomplete information, a player's <b>type</b> encodes:",
  opts: ["The player's equilibrium strategy in the repeated version of the game, which depends on the full history of past play.", "The history of actions the player has taken in previous rounds, which forms her reputation and constrains future strategy choices.", "Private payoff-relevant information — such as cost or valuation — unknown to other players.", "The player's rank in the social hierarchy."],
  correct: 2,
  explain: "<span class=\"verdict\">A type captures all private payoff-relevant information — cost, value, quality — that creates the incomplete-information structure.</span>\nIncomplete information means uncertainty about types, not about move history (that is imperfect information). Each player knows her own type and has a prior over opponents' types. A strategy in a Bayesian game maps types to actions.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Cournot vs Bertrand — strategic variable",
  q: "The key difference between <b>Cournot</b> and <b>Bertrand</b> competition is:",
  opts: ["Cournot is a sequential game; Bertrand is a simultaneous game.", "Cournot applies to differentiated products; Bertrand applies only to identical goods.", "Cournot firms choose price simultaneously; Bertrand firms choose quantity simultaneously.", "Cournot firms choose quantity simultaneously; Bertrand firms choose price simultaneously."],
  correct: 3,
  explain: "<span class=\"verdict\">Cournot: quantities are the strategic variable. Bertrand: prices are the strategic variable.</span>\nThis drives very different equilibrium outcomes: Cournot yields positive profits above marginal cost, while Bertrand with identical goods drives price to marginal cost ($\\pi^N = 0$). Both are simultaneous-move games in their standard forms; product differentiation is not part of the definition of either.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Cournot best response and equilibrium output",
  q: "Firm 1 in a Cournot duopoly has profit $\\pi_1 = (a - q_1 - q_2 - c)q_1$. The best-response function and symmetric equilibrium quantity are:",
  opts: ["BR: $q_1 = \\frac{a - c - q_2}{2}$; symmetric NE: $q^* = \\frac{a-c}{3}$.", "BR: $q_1 = a - c - q_2$; symmetric NE: $q^* = \\frac{a-c}{2}$.", "BR: $q_1 = \\frac{a-c}{2}$; symmetric NE: $q^* = \\frac{a-c}{2}$.", "BR: $q_1 = \\frac{a - c - 2q_2}{3}$; NE: $q^* = \\frac{a-c}{5}$."],
  correct: 0,
  explain: "<span class=\"verdict\">FOC gives $a - 2q_1 - q_2 - c = 0 \\Rightarrow q_1 = \\frac{a-c-q_2}{2}$; symmetry yields $q^* = \\frac{a-c}{3}$.</span>\nThe best-response slope is $-\\frac{1}{2}$ (strategic substitutes). Setting $q_2 = 0$ gives the monopoly response $\\frac{a-c}{2}$; imposing $q_1 = q_2$ in the two BRs solves to $\\frac{a-c}{3}$. Per-firm Cournot profit is $\\frac{(a-c)^2}{9}$.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Stackelberg first-mover",
  q: "In the Stackelberg duopoly with $P = a - Q$ and constant marginal cost $c$, the leader's equilibrium quantity and profit are:",
  opts: ["$q_1 = \\frac{a-c}{3}$, $\\pi_1 = \\frac{(a-c)^2}{9}$ — symmetric Cournot, so no first-mover advantage materialises here.", "$q_1 = \\frac{a-c}{2}$, $\\pi_1 = \\frac{(a-c)^2}{8}$ — the leader's equilibrium outcome, strictly better than Cournot.", "$q_1 = \\frac{a-c}{4}$, $\\pi_1 = \\frac{(a-c)^2}{16}$ (the follower's outcomes).", "$q_1 = a - c$, $\\pi_1 = 0$ — competitive Bertrand-style outcome where price is driven to marginal cost."],
  correct: 1,
  explain: "<span class=\"verdict\">The leader substitutes the follower's best-response into her own profit and maximizes — this yields the monopoly quantity $\\frac{a-c}{2}$.</span>\nThe follower then produces $\\frac{a-c}{4}$ and earns $\\frac{(a-c)^2}{16}$. The leader earns $\\frac{(a-c)^2}{8}$, strictly more than Cournot $\\frac{(a-c)^2}{9}$ — this is the first-mover advantage.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Bertrand outcome",
  q: "In the standard Bertrand model with two firms, identical goods, and constant marginal cost $c$, the Nash equilibrium has:",
  opts: ["Price equal to the monopoly level $\\frac{a+c}{2}$.", "Price halfway between monopoly price and marginal cost.", "Price equal to marginal cost $c$, with both firms earning zero profit.", "Price slightly above $c$, with each firm earning a small positive profit."],
  correct: 2,
  explain: "<span class=\"verdict\">Bertrand competition drives price to marginal cost — the \"Bertrand paradox\" — even with only two firms.</span>\nEach firm undercuts the other as long as price exceeds marginal cost, so the only NE is $p = c$ with zero profit. The guide records $\\pi^N = 0$ for Bertrand, which directly generates $\\delta^* = \\frac{\\pi^D - \\pi^M}{\\pi^D - 0} = \\frac{1}{2}$ in the repeated-game formula.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Repeated games — why infinite horizon matters",
  q: "Why can infinite repetition (with $\\delta \\lt 1$) sustain cooperation while finitely repeated play with a <b>unique</b> stage NE cannot?",
  opts: ["Players in the infinite game are arbitrarily patient, meaning $\\delta$ approaches 1 so they always prefer cooperation over any finite defection gain.", "The infinite game has more stage-game Nash equilibria.", "In a finite game, backward induction unravels from the last period; an infinite game has no terminal period to anchor that argument.", "Finite repetition is cooperative by design because the finite horizon creates credible commitment opportunities absent in the infinite-horizon case."],
  correct: 2,
  explain: "<span class=\"verdict\">Finite horizon + unique stage NE: backward induction unravels cooperation from $T$ back to period 1; infinite horizon has no terminal period to anchor the unraveling.</span>\nIn the last period of a finite game, players play the stage NE. Knowing that, period $T-1$ collapses too, and so on. With no last period, grim trigger can support cooperation for $\\delta \\ge \\delta^*$.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Discount factor meaning",
  q: "In a repeated game, a discount factor $\\delta$ close to 1 means:",
  opts: ["Players care less about the future and are more likely to defect today.", "Players are highly patient — future payoffs count nearly as much as today's.", "The game will be repeated fewer times in expectation, making the horizon closer to finite and weakening punishment threats accordingly.", "The stage-game payoffs are larger in magnitude, providing greater incentives for cooperation relative to the one-shot deviation gain."],
  correct: 1,
  explain: "<span class=\"verdict\">$\\delta$ close to 1 means high patience — future punishments loom large, making collusion easier to sustain.</span>\nThe present value of a perpetual stream $\\pi$ per period is $\\frac{\\pi}{1-\\delta}$, which grows as $\\delta \\to 1$. A lower $\\delta$ implies impatience — future punishments are nearly worthless, so defecting today is attractive. Cooperation requires $\\delta \\ge \\delta^*$.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Grim trigger strategy",
  q: "The <b>grim trigger</b> strategy in an infinitely repeated game specifies:",
  opts: ["Defect for a fixed number of periods as punishment, then return to cooperation — a forgiving strategy with a finite punishment window.", "Cooperate as long as neither player has ever deviated; switch to permanent defection the moment any deviation occurs.", "Randomize between cooperate and defect with equal probability each period, ignoring all history.", "Cooperate in odd periods and defect in even periods regardless of history, cycling between outcomes each round."],
  correct: 1,
  explain: "<span class=\"verdict\">Grim trigger: cooperate until the first deviation, then defect forever — the most severe credible punishment.</span>\nBecause punishment is permanent (reversion to the stage NE forever), grim trigger minimizes $\\delta^*$ among trigger strategies. A fixed punishment window is milder. The formula $\\delta^* = \\frac{\\pi^D - \\pi^M}{\\pi^D - \\pi^N}$ is derived under this permanent reversion.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Computing delta* — one-step",
  q: "Given $\\pi^D = 16$, $\\pi^M = 8$, $\\pi^N = 0$, the minimum discount factor $\\delta^*$ for grim-trigger collusion is:",
  opts: ["$\\frac{1}{3}$ — collusion sustainable only for low temptation relative to stakes", "$\\frac{1}{4}$ — a very low threshold, easier to sustain than the Bertrand benchmark", "$\\frac{3}{4}$ — a high threshold; collusion is hard to sustain at this patience level", "$\\frac{1}{2}$ — the Bertrand-case result, since $\\pi^N = 0$ makes the formula $\\frac{\\pi^D - \\pi^M}{\\pi^D}$"],
  correct: 3,
  explain: "<span class=\"verdict\">$\\delta^* = \\frac{\\pi^D - \\pi^M}{\\pi^D - \\pi^N} = \\frac{16-8}{16-0} = \\frac{8}{16} = \\frac{1}{2}$.</span>\nPlug directly into the formula: temptation gain $= \\pi^D - \\pi^M = 8$; total stakes $= \\pi^D - \\pi^N = 16$. Their ratio is $\\frac{1}{2}$ — the same as the Bertrand benchmark because $\\pi^N = 0$ in both cases. Any $\\delta \\ge \\frac{1}{2}$ sustains collusion.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Folk theorem gist",
  q: "The <b>Folk theorem</b> for infinitely repeated games states (informally) that:",
  opts: ["For discount factors sufficiently close to 1, any feasible and individually rational payoff vector can be sustained as an SPNE of the repeated game.", "Every stage-game Nash equilibrium payoff is achieved in every period — the Folk theorem merely confirms what one-shot analysis already implies.", "Cooperation is impossible unless the stage game has multiple Nash equilibria, which are needed as carrot-and-stick incentives for trigger strategies.", "Players will always reach the Pareto-optimal outcome once the game is repeated enough times with sufficiently patient discounting."],
  correct: 0,
  explain: "<span class=\"verdict\">Folk theorem: with $\\delta$ near 1, the sustainable SPNE payoffs fill the feasible individually-rational region.</span>\n\"Individually rational\" means each player gets at least her minmax value — not necessarily the Nash payoff. \"Feasible\" means in the convex hull of stage-game payoffs. The Nash payoffs are one interior point of this region, not the boundary.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Minmax value",
  q: "The <b>minmax value</b> $\\underline{v}_i$ for player $i$ in a game is:",
  opts: ["Player $i$'s Nash equilibrium payoff in the stage game — a common confusion, but the NE payoff is typically strictly above the minmax floor.", "The average of $i$'s highest and lowest possible payoffs, providing a simple measure of outcome variability across the strategy space.", "The lowest payoff opponents can hold $i$ to when $i$ best-responds: $\\underline{v}_i = \\min_{s_{-i}} \\max_{s_i} u_i(s_i, s_{-i})$.", "Player $i$'s payoff when all players simultaneously play their Nash equilibrium strategies in the stage game."],
  correct: 2,
  explain: "<span class=\"verdict\">Minmax: opponents choose to minimize $i$'s payoff; $i$ does the best she can against that — it is the floor she can guarantee.</span>\nThe guide flags \"minmax $\\ne$ Nash payoff\" as a key deduction. In the Folk theorem, payoffs must strictly exceed the minmax vector for individual rationality. Options 1 and 4 both describe the Nash payoff, which is a different (usually higher) concept.<span class=\"ref\">Guide §3.5</span>"

{ type: "micro", topic: "Signaling — sender and receiver",

function shuffleQuiz() {
  for (let i = quiz.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
  }
}
shuffleQuiz();
let current = 0;
let score = 0;
let answered = false;
const results = [];

function render() {
  const q = quiz[current];
  const card = document.getElementById("card");
  let html = '';
  html += '<div class="card-meta"><span class="tag ' + q.type + '">' + (q.type === "metrics" ? "Econometrics" : "Microeconomics") + '</span><span class="topic-tag">' + q.topic + '</span></div>';
  html += '<div class="question">Q' + (current+1) + '. ' + q.q + '</div>';
  html += '<div class="options">';
  const letters = ['A','B','C','D'];
  for (let i = 0; i < q.opts.length; i++) {
    html += '<button class="opt" id="opt'+i+'" onclick="pick('+i+')"><span class="letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></button>';
  }
  html += '</div>';
  html += '<div class="explain" id="explain">' + q.explain + '</div>';
  card.innerHTML = html;

  answered = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("nextBtn").textContent = current === quiz.length - 1 ? "Finish ✓" : "Next →";
  const pct = (current / quiz.length * 100).toFixed(0);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("topicLabel").textContent = "Question " + (current+1) + " / " + quiz.length;
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([card]);
}

function pick(i) {
  if (answered) return;
  answered = true;
  const q = quiz[current];
  const right = i === q.correct;
  if (right) score++;
  results.push({ topic: q.topic, type: q.type, right: right });
  for (let j = 0; j < q.opts.length; j++) {
    const el = document.getElementById("opt" + j);
    el.disabled = true;
    if (j === q.correct) el.classList.add("correct");
    else if (j === i) el.classList.add("wrong");
    else el.classList.add("dim");
  }
  const ex = document.getElementById("explain");
  ex.classList.add("visible");
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  document.getElementById("nextBtn").disabled = false;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([ex]);
}

function next() {
  if (!answered) return;
  if (current < quiz.length - 1) { current++; render(); }
  else finish();
}

function finish() {
  const card = document.getElementById("card");
  const pctScore = Math.round(score / quiz.length * 100);
  let grade;
  if (pctScore >= 90) grade = "As expected for a warm-up — you own the fundamentals.";
  else if (pctScore >= 75) grade = "Solid — drill the misses below, then re-run.";
  else if (pctScore >= 60) grade = "Passing-adjacent. The misses map to guide sections — restudy those first.";
  else grade = "These are the freebies — review guide §3.5–§3.6 and §4.1–4.3 tonight, then re-run.";
  let html = '<div class="bigscore">' + score + ' / ' + quiz.length + '</div>';
  html += '<div class="grade">' + pctScore + '% — ' + grade + '</div>';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    html += '<div class="result-line"><span>Q' + (i+1) + ' · ' + (r.type === "metrics" ? "Metrics" : "Micro") + ' · ' + r.topic + '</span><span class="' + (r.right ? 'ok' : 'miss') + '">' + (r.right ? '✓' : '✗') + '</span></div>';
  }
  html += '<div class="nav" style="margin-top:16px"><button onclick="restart()">↻ Restart quiz</button></div>';
  card.innerHTML = html;
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("topicLabel").textContent = "Done";
  document.getElementById("nextBtn").disabled = true;
}

function restart() {
  shuffleQuiz();
  current = 0; score = 0; answered = false; results.length = 0;
  render();
}

document.addEventListener("keydown", e => {
  if (["1","2","3","4"].includes(e.key) && !answered) { pick(parseInt(e.key)-1); }
  if ((e.key === "Enter" || e.key === "ArrowRight") && answered) next();
});

render();
</script>
</body>
</html>
