<script>
const quiz = [
{ type: "micro", topic: "UMP linear utility",
  q: "Solve the UMP for u(x\\u2081,x\\u2082) = 2x\\u2081 + 3x\\u2082 subject to p\\u2081x\\u2081 + p\\u2082x\\u2082 = w.",
  opts: ["Set MRS = p\\u2081/p\\u2082 via the Lagrangian FOCs \\u03b1\\u1d62 = \\u03bcp\\u1d62; divide to get 2/3 = p\\u2081/p\\u2082; this tangency condition yields a unique interior solution valid for all strictly positive prices.", "Apply the Lagrangian; since both FOCs hold simultaneously at the tangency, pin x\\u2081 and x\\u2082 from budget and MRS; the Inada condition on both goods ensures the interior solution always holds.", "Invoke the Extreme Value Theorem: a maximum exists on a compact budget set; check all four boundary kink points, the two ends of the budget line and two additional kink points from the utility's piecewise structure.", "Compare utility-per-dollar \\u03b1\\u1d62/p\\u1d62 for each good; allocate the entire budget to the good with the strictly higher ratio, setting the other good to zero; if ratios are equal any convex combination is optimal."],
  correct: 3,
  explain: "<span class=\"verdict\">Correct: compare \\u03b1\\u1d62/p\\u1d62 and allocate to the highest-ratio corner.</span> Linear utility is not strictly quasi-concave, so no interior tangency arises and the entire budget goes to the highest-ratio good. <b>The first strategy</b> uses the tangency condition as if an interior solution always exists; for linear utility the FOC interior point is generically not on the budget line as a unique solution, violating the corner-check rule. <b>The second strategy</b> invokes Inada conditions on both goods; Inada conditions apply to utilities with infinite marginal utility at zero, but the linear utility 2x\\u2081+3x\\u2082 has constant marginal utilities and no Inada condition. <b>The third strategy</b> lists four boundary kink points but a linear budget set has only two corners; inventing two extra kink points is a structural error. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "micro", topic: "UMP convex quadratic utility",
  q: "Solve the UMP for u(x\\u2081,x\\u2082) = x\\u2081\\u00b2 + x\\u2082\\u00b2 subject to p\\u2081x\\u2081 + p\\u2082x\\u2082 = w.",
  opts: ["Apply the Lagrangian; because FOCs are necessary for any differentiable constrained problem, solve 2x\\u1d62 = \\u03bcp\\u1d62 and confirm the tangency interior solution is a global maximum by checking that the bordered Hessian satisfies the standard negative semi-definite sufficient second-order conditions for a constrained maximum.", "Note that u is convex, not quasi-concave; the FOCs via Lagrangian find a constrained minimum; by the Extreme Value Theorem the global max is at a boundary; compare u at (w/p\\u2081,0) vs (0,w/p\\u2082) and allocate all wealth to good i* = argmax\\u1d62 1/p\\u1d62\\u00b2.", "Use the tangency condition MRS = p\\u2081/p\\u2082 giving x\\u2081/x\\u2082 = p\\u2081/p\\u2082 together with the budget constraint to find strictly interior demands; the tangency is the unique constrained optimum since u is continuously differentiable and the budget set is a compact convex set.", "Maximize by listing all three candidate points: the interior FOC point satisfying the Lagrangian condition and both corner points (w/p\\u2081,0) and (0,w/p\\u2082); compute u at each candidate, identify the two largest utility values, and average them to obtain the globally optimal consumption bundle."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: convex u corners at argmax 1/p\\u1d62\\u00b2 (cheapest good), verified by corner comparison.</span> <b>The first strategy</b> applies the bordered Hessian as a sufficiency check; the bordered Hessian test is valid for quasi-concave problems but not for convex u, where the FOC point is a constrained minimum rather than a maximum. <b>The third strategy</b> uses the interior MRS tangency condition, which is invalid because u is not quasi-concave; the interior FOC point is the global minimum on the budget line. <b>The fourth strategy</b> proposes averaging the FOC interior point and both corners; this is mathematically incoherent and no standard optimization procedure averages candidate points to find a global maximum. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "micro", topic: "UMP quasi-linear low wealth",
  q: "Solve the UMP for u(x\\u2081,x\\u2082) = \\u221ax\\u2081 + x\\u2082 with prices p\\u2081,p\\u2082 > 0 and wealth w. When does a corner arise?",
  opts: ["Interior tangency gives x\\u2081* = (p\\u2082/(2p\\u2081))\\u00b2; this is valid only if w \\u2265 p\\u2082\\u00b2/(4p\\u2081); otherwise the consumer exhausts wealth on good 1 with x\\u2082* = 0; state both cases and check the wealth threshold explicitly.", "Write the Lagrangian and derive the interior tangency x\\u2081* = (p\\u2082/(2p\\u2081))\\u00b2 and x\\u2082* = (w - p\\u2081x\\u2081*)/p\\u2082; since the Inada condition on good 1 holds (MU\\u2081 \\u2192 \\u221e as x\\u2081 \\u2192 0), the interior solution always obtains for all w > 0.", "Apply the Kuhn-Tucker conditions with non-negativity constraints on both goods; the shadow multiplier on x\\u2082 reveals when the corner arises; the corner on good 2 occurs when p\\u2082 > p\\u2081, making the numeraire too expensive relative to good 1; when p\\u2082 \\u2264 p\\u2081 the interior always holds regardless of w.", "Note u is strictly concave in x\\u2081 and linear in x\\u2082; FOCs are necessary and sufficient throughout; the unique interior solution x\\u2081* = (p\\u2082/(2p\\u2081))\\u00b2 always holds because strict concavity in x\\u2081 rules out any boundary optimum."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: interior tangency valid only when w \\u2265 p\\u2082\\u00b2/(4p\\u2081); below this threshold corner at x\\u2082*=0.</span> <b>The second strategy</b> claims the interior solution always holds because of the Inada condition on good 1; the Inada condition rules out x\\u2081=0 but does not rule out x\\u2082=0; when w is small, the consumer uses all wealth on good 1 and the corner at x\\u2082*=0 is the optimum. <b>The third strategy</b> asserts the corner arises when p\\u2082 > p\\u2081, confusing a price comparison with the wealth condition; the relevant threshold is w vs p\\u2082\\u00b2/(4p\\u2081), not a price ratio. <b>The fourth strategy</b> claims strict concavity in x\\u2081 rules out any boundary optimum; strict concavity rules out a corner at x\\u2081=0 (Inada) but does not rule out x\\u2082=0 when wealth is insufficient. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "micro", topic: "UMP satiated utility",
  q: "Solve the UMP for u(x\\u2081,x\\u2082) = \\u03b1 min{x\\u2081,10} + x\\u2082 with \\u03b1 > 1. Find x*(p,w) and v(p,w).",
  opts: ["Treat the satiation cap as a Leontief kink; equate \\u03b1 = p\\u2081/p\\u2082 to find the transition price ratio; the cap binds iff \\u03b1p\\u2082 = p\\u2081; for \\u03b1p\\u2082 > p\\u2081 spend all wealth on good 1 up to the kink, allocating any remaining income to good 2; this procedure is analogous to the standard Leontief equilibration.", "Write the Lagrangian; use the subdifferential of min{x\\u2081,10} at x\\u2081=10 to derive an interior FOC; set the shadow value of the satiation constraint equal to \\u03b1 and solve for x\\u2082 from the budget constraint; verify the KKT complementary slackness conditions hold.", "Compare utility-per-dollar: if \\u03b1/p\\u2081 > 1/p\\u2082 (i.e., \\u03b1p\\u2082 > p\\u2081), buy x\\u2081 up to the satiation cap of 10 first at cost 10p\\u2081; allocate remaining w-10p\\u2081 to x\\u2082 if w > 10p\\u2081; if w < 10p\\u2081, set x\\u2081 = w/p\\u2081 and x\\u2082 = 0.", "Apply Roy's identity to v = w\\u00b7max(\\u03b1/p\\u2081, 1/p\\u2082) to recover x*; Roy is valid because the utility is piecewise linear and the duality square closes automatically for all piecewise linear utilities."],
  correct: 2,
  explain: "<span class=\"verdict\">Correct: compare \\u03b1/p\\u2081 vs 1/p\\u2082; buy x\\u2081 to cap 10, redirect surplus to x\\u2082.</span> <b>The first strategy</b> treats the satiation cap as a Leontief-type kink equated by \\u03b1 = p\\u2081/p\\u2082; min{x,10} is not a Leontief and the relevant condition for hitting the cap is comparing utility-per-dollar ratios, not setting \\u03b1 equal to a price ratio. <b>The second strategy</b> applies the subdifferential at x\\u2081=10; while the subdifferential approach is valid in principle, for this piecewise linear problem the correct method is the utility-per-dollar corner comparison; applying subdifferentials without first checking the regime adds unnecessary complexity and is not the standard approach in the guide. <b>The fourth strategy</b> invokes Roy's identity on an assumed v; Roy requires the correctly derived v from the UMP, not a postulated form, and v is not simply w\\u00b7max(\\u03b1/p\\u2081,1/p\\u2082) once the cap binds. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "micro", topic: "EMP convex quadratic utility",
  q: "Solve the EMP for u(x\\u2081,x\\u2082) = x\\u2081\\u00b2 + x\\u2082\\u00b2 targeting utility level u. Find h(p,u) and e(p,u).",
  opts: ["The utility constraint x\\u2081\\u00b2+x\\u2082\\u00b2=u is a circle of radius \\u221au; minimize the linear cost p\\u00b7x on this circle; the interior tangency p\\u1d62 = 2\\u03bcx\\u1d62 yields h\\u1d62 = p\\u1d62\\u221au/\\u221a(p\\u2081\\u00b2+p\\u2082\\u00b2) and e = \\u221a(u(p\\u2081\\u00b2+p\\u2082\\u00b2)).", "Mirror the UMP approach: since convex u means the UMP corners at an extreme point, the EMP must also corner; check the two extreme points of the utility constraint x\\u2081\\u00b2+x\\u2082\\u00b2=u, namely (\\u221au,0) and (0,\\u221au); pick the bundle with strictly lower expenditure p\\u00b7h as the Hicksian demand.", "Apply the Leontief analogy: since x\\u2081\\u00b2+x\\u2082\\u00b2=u defines a circle, set x\\u2081=x\\u2082=\\u221a(u/2) at the symmetric point; this minimizes expenditure when p\\u2081=p\\u2082; for unequal prices, extend by a MRS tangency condition applied at the symmetric point.", "Write the Lagrangian; FOCs p\\u1d62 = 2\\u03bcx\\u1d62 are sufficient here because the EMP objective is linear; plug back to get h\\u1d62 = p\\u1d62/(2\\u03bc) with \\u03bc = \\u221a(\\u03a3p\\u1d62\\u00b2/u)/2, confirming the interior solution is valid."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: EMP on a circle is interior; h\\u1d62 = p\\u1d62\\u221au/\\u221a(\\u2211p\\u1d62\\u00b2).</span> The UMP corners because convex u means the maximum of a linear function over a convex budget set is at an extreme point; but the EMP minimizes a linear function over the circular level set, which always has an interior minimum. <b>The second strategy</b> mirrors the UMP corner logic onto the EMP, reversing the geometry; the constraint set in the EMP is the circle, not a convex set, so the minimum of a linear function on a circle is interior. <b>The third strategy</b> uses a Leontief analogy to anchor the solution at the symmetric point x\\u2081=x\\u2082; the Leontief kink argument does not apply to a circle, and for unequal prices the optimum is not at x\\u2081=x\\u2082. <b>The fourth strategy</b> claims FOC sufficiency from the linearity of the EMP objective without explaining the geometric inversion; the argument should cite the convex constraint set (circle) that reverses the UMP corner logic. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "micro", topic: "Slutsky derivation",
  q: "Derive the Slutsky equation starting from the identity h\\u2c7c(p,u) = x\\u2c7c(p,e(p,u)).",
  opts: ["Differentiate both sides w.r.t. p\\u2096; on the left apply Shephard's lemma; on the right use the chain rule and recognize \\u2202e/\\u2202p\\u2096 = h\\u2096 by Shephard; rearrange to obtain \\u2202x\\u2c7c/\\u2202p\\u2096 = \\u2202h\\u2c7c/\\u2202p\\u2096 - x\\u2096(\\u2202x\\u2c7c/\\u2202w).", "Differentiate the identity x\\u2c7c(p,w) = h\\u2c7c(p,v(p,w)) w.r.t. p\\u2096 and apply Roy's identity on \\u2202v/\\u2202p\\u2096 = -x\\u2096(\\u2202v/\\u2202w) on the right-hand side; rearrange to obtain the Slutsky decomposition without invoking Shephard's lemma on the expenditure function.", "Apply the envelope theorem to the UMP value function v(p,w); differentiate v w.r.t. p\\u2096 to obtain the income term via Roy's identity; then equate the total price derivative of x\\u2c7c to the sum of substitution and income effects, bypassing Shephard entirely.", "Differentiate the Slutsky matrix S = D\\u209ah using Shephard's lemma on each h\\u2096 element; note the income effect enters the decomposition as S\\u2c7c\\u2096 = \\u2202x\\u2c7c/\\u2202p\\u2096 + x\\u2096(\\u2202x\\u2c7c/\\u2202w) where the sign on the income term is positive, then rearrange to recover the standard Slutsky equation with the subtraction sign."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: differentiate h\\u2c7c = x\\u2c7c(p,e(p,u)) w.r.t. p\\u2096; use Shephard on \\u2202e/\\u2202p\\u2096 = h\\u2096; rearrange.</span> <b>The second strategy</b> starts from the wrong identity and invokes Roy's identity rather than Shephard; Roy delivers a demand level expression, not the price derivative needed for Slutsky, and mixing the two derivation routes yields an incorrect decomposition. <b>The third strategy</b> applies the envelope theorem to v (giving Roy's identity) and asserts this yields Slutsky; Roy's identity gives a demand level, not the Slutsky price-derivative decomposition, and the chain is incomplete without Shephard. <b>The fourth strategy</b> signs the income effect incorrectly: the Slutsky equation has \\u2202x\\u2c7c/\\u2202p\\u2096 = S\\u2c7c\\u2096 <b>minus</b> x\\u2096(\\u2202x\\u2c7c/\\u2202w); writing plus contradicts the standard formula. <span class=\"ref\">Guide §3.2</span>"
},
{ type: "micro", topic: "Duality verification",
  q: "You have derived v(p,w) and e(p,u) for a Cobb-Douglas utility. What must be verified to confirm duality, and what assumption ensures the budget binds?",
  opts: ["Confirm that v is homogeneous of degree zero in (p,w) and that e is homogeneous of degree one in p; these two homogeneity conditions are necessary and sufficient for all four duality-square identities to hold; non-satiation is automatic for Cobb-Douglas and need not be separately stated.", "Apply Shephard's lemma: differentiate e w.r.t. p\\u1d62 and confirm the result equals h\\u1d62; this single Shephard check is sufficient for the full duality square because it simultaneously verifies all four identities and the demand-function links.", "Verify the bordered Hessian of the UMP Lagrangian is negative semi-definite at the optimum; concavity of e(p,u) in prices is the key property for duality to hold; Cobb-Douglas preferences are globally monotone so local non-satiation is automatic.", "Verify both cross-identities e(p,v(p,w))=w and v(p,e(p,u))=u arithmetically; confirm x(p,w)=h(p,v(p,w)); invoke local non-satiation to justify that the budget constraint binds, enabling all four duality-square identities."],
  correct: 3,
  explain: "<span class=\"verdict\">Correct: verify both cross-identities and invoke LNS for binding budget constraint.</span> <b>The first strategy</b> checks only homogeneity degrees; while homogeneity is a necessary sanity check, it is not sufficient to confirm duality — the cross-identities e(p,v(p,w))=w and v(p,e(p,u))=u must be verified directly as the guide requires. <b>The second strategy</b> claims Shephard's lemma alone is sufficient for the full duality square; Shephard verifies the h-e link but does not substitute for checking the cross-identities or that the Marshallian and Hicksian demands agree. <b>The third strategy</b> invokes the bordered Hessian for concavity of e in p; concavity of e is a consequence of duality, not a means of verifying it, and omitting local non-satiation loses the reason the budget constraint binds. <span class=\"ref\">Guide §3.2</span>"
},
{ type: "micro", topic: "Representation finite X",
  q: "Prove that any complete and transitive preference on a finite set X has a utility representation.",
  opts: ["Invoke Debreu's theorem: completeness and transitivity on any set imply a continuous utility representation; the finite case is a direct corollary requiring no separate argument beyond citing Debreu.", "Construct u(x) = #{y \\u2208 X : x \\u227d y}; show completeness ensures every comparison is defined; show transitivity ensures x \\u227d z iff u(x) \\u2265 u(z); note this requires no continuity axiom since X is finite.", "Define u(x) = #{y : x \\u227b y} (strict upper contour count); since X is finite and preferences are transitive this counting function is well-defined and correctly represents \\u227d without additional axioms.", "Appeal to compact metrizable spaces: finite sets are trivially compact metric spaces with the discrete topology; completeness plus transitivity plus this compact metric structure on a finite set implies a continuous utility representation exists by a direct application of Debreu's theorem."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: define u(x) = #{y : x \\u227d y} and verify weak-order preservation using completeness and transitivity.</span> <b>The first strategy</b> misapplies Debreu: the Debreu theorem requires a continuity axiom on the preference relation, which is exactly what the finite-X argument avoids; the finite case is not a corollary of Debreu. <b>The third strategy</b> uses the strict upper contour count #{y : x \\u227b y}; this fails to represent indifference correctly because two bundles with x ~ z may receive different strict-counts, so u(x) = u(z) is not guaranteed when x ~ z. <b>The fourth strategy</b> invokes Debreu via topological compactness; Debreu's continuity condition is a property of the preference relation, not of the topology of X, and the argument is circular. <span class=\"ref\">Guide §3.3</span>"
},
{ type: "micro", topic: "Condorcet cycle transitivity",
  q: "Preferences over bundles are defined by majority rule: x \\u227d y if x beats y on at least 2 of 3 attributes. Determine whether transitivity holds.",
  opts: ["Verify transitivity by checking all triples; since each individual attribute ordering is itself transitive, any majority-rule aggregation of transitive orderings is also transitive by a direct application of Arrow's impossibility theorem to this single-agent attribute-aggregation setting.", "Apply the finite-X counting representation: define u(x) = #{y : x \\u227d y} and check whether this function is well-defined; if it is well-defined, transitivity follows; use the well-definedness test as a proxy for verifying transitivity.", "Construct an explicit Condorcet cycle: let x=(1,1,0), y=(0,1,1), z=(1,0,1); show x \\u227d y (wins attributes 1,2), y \\u227d z (wins attributes 2,3), z \\u227d x (wins attributes 1,3); conclude x \\u227d y \\u227d z \\u227d x so transitivity fails.", "Note that majority rule defines a complete relation since for any two bundles one wins on at least 2 of 3 attributes; completeness plus the Debreu representation theorem then implies transitivity holds for preferences on any finite bundle set, so majority-rule preferences must be transitive."],
  correct: 2,
  explain: "<span class=\"verdict\">Correct: construct the explicit three-bundle Condorcet cycle with numerical vectors and show x \\u227d y \\u227d z \\u227d x.</span> <b>The first strategy</b> misapplies Arrow's theorem; Arrow's theorem concerns aggregation across multiple individuals, not majority rule over attributes of a single agent, and it does not imply transitivity. <b>The second strategy</b> reasons backward: the counting argument is valid only if the relation is already complete and transitive; using it to test transitivity is circular. <b>The fourth strategy</b> conflates completeness with transitivity and incorrectly invokes Debreu; Debreu additionally requires a continuity axiom and does not imply transitivity from completeness alone. <span class=\"ref\">Guide §3.3</span>"
},
{ type: "micro", topic: "EU linearity test mean-variance",
  q: "Ann prefers lottery p to q iff E\\u209a[z] - Var\\u209a(z) \\u2265 E\\u1d60[z] - Var\\u1d60(z). Does an EU representation exist?",
  opts: ["A utility representation exists (W is a complete transitive total order) but EU does not: Var(z) = E[z\\u00b2]-(E[z])\\u00b2 is quadratic in p, so W(p) is not linear in p; independence fails; W is not an expected utility functional.", "Yes: W(p)=E[z]-Var(z) is complete and transitive, so by the finite-X counting argument a utility function exists; since W uses expectations it must be linear in p, confirming the EU representation.", "Neither utility nor EU: the AND-criterion structure (EV minus Var) creates a partial order that is incomplete whenever two lotteries share the same mean but differ in variance, preventing any scalar utility assignment.", "EU exists: rewrite W(p) = E[z-z\\u00b2] + (E[z])\\u00b2; the extra quadratic term (E[z])\\u00b2 is linear in p for distributions with fixed support, so independence is not violated and W is an expected utility functional."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: W is a utility (complete, transitive scalar) but NOT EU because Var is quadratic in p, violating independence.</span> <b>The second strategy</b> incorrectly concludes EU holds by asserting that any criterion defined using expectations must be linear in p; variance is quadratic in probabilities, so the criterion violates independence even though it involves expectations. <b>The third strategy</b> confuses W(p)=E[z]-Var(z) with the AND-type partial order; W is a complete total order (a single scalar), not an incomplete partial order; a utility representation does exist, contrary to the strategy's claim. <b>The fourth strategy</b> rewrites W and falsely claims (E[z])\\u00b2 is linear in p; (E[z])\\u00b2 = (\\u2211z\\u00b7p(z))\\u00b2 is quadratic in p regardless of support. <span class=\"ref\">Guide §3.4</span>"
},
{ type: "micro", topic: "EU from indicator criterion",
  q: "Bob prefers lottery p to q iff P\\u209a(z \\u2265 50) \\u2265 P\\u1d60(z \\u2265 50). Construct the Bernoulli utility and verify EU.",
  opts: ["Define u(z) = 1{z \\u2265 50}; then E\\u209a[u(z)] = P\\u209a(z \\u2265 50); the criterion is linear in p; independence holds and the EU representation is W(p) = E\\u209a[u(z)] with this specific Bernoulli u.", "Set u(z) = P(z \\u2265 50), treating the cumulative probability as a function of the prize z; this yields a non-linear Bernoulli function that still represents the lottery ordering; Jensen's inequality for concave u then confirms the EU representation is valid.", "Verify EU by the midpoint test: for lotteries with P\\u209a(z \\u2265 50)=0.6 and P\\u1d60(z \\u2265 50)=0.4, their equal-weight mixture has probability 0.5, equaling the average, confirming linearity in p; any non-decreasing u gives an EU representation.", "Apply the FOSD theorem: P(z \\u2265 50) is a single-threshold criterion, not full FOSD which requires P(z \\u2265 t) for all t; but since FOSD is represented by any non-decreasing u, any such Bernoulli u represents this threshold criterion and multiple EU representations exist."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: u(z) = 1{z \\u2265 50} makes E[u] = P(z \\u2265 50) exactly, which is linear in p.</span> <b>The second strategy</b> sets u(z) = P(z \\u2265 50), conflating the probability of an event with a Bernoulli utility over prizes; u must be a function of the prize z alone, not of the lottery probability, and this formulation is circular. <b>The third strategy</b> concludes that any non-decreasing u gives a representation; only the indicator u(z)=1{z\\u2265 50} represents this specific criterion, not an arbitrary non-decreasing u. <b>The fourth strategy</b> invokes the FOSD theorem, but FOSD requires P(z \\u2265 t) \\u2265 Q(z \\u2265 t) for all thresholds t, not just at t=50; the criterion is strictly weaker than FOSD and requires only the single indicator Bernoulli u. <span class=\"ref\">Guide §3.4</span>"
},
{ type: "micro", topic: "Risk aversion midpoint test",
  q: "An agent has u(0)=0, u(100)=1, u(200)=3. Is this agent risk-averse, risk-neutral, or risk-loving? Apply the midpoint test.",
  opts: ["Compute CE: CE solves u(CE)=1.5; since u(200)=3, CE=100\\u00d7(1.5/3)=50 < 100=E[z]; CE < E[z] implies concave u and risk aversion.", "Apply the midpoint test: u(100) must be \\u2265 (u(0)+u(200))/2 = 1.5 for risk aversion; since u(100)=1 < 1.5, the midpoint test fails and the agent is risk-loving.", "Check the second differences: u(200)-u(100)=2 > u(100)-u(0)=1; increasing differences confirm convexity; this is consistent with u(100) < (u(0)+u(200))/2=1.5 and confirms risk-loving via the midpoint test.", "Compute E[u] for the 50-50 lottery: E[u]=0.5(0)+0.5(3)=1.5; u(E[z])=u(100)=1; since E[u]=1.5 > u(E[z])=1, Jensen's inequality confirms the agent is risk-loving (convex Bernoulli function)."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: midpoint test u(100)=1 < (0+3)/2=1.5 confirms risk-loving.</span> <b>The first strategy</b> computes CE=100\\u00d7(1.5/3)=50 and concludes CE < E[z] implies risk aversion; but the CE computation is incorrect (u(CE)=1.5 with u(200)=3 gives CE=100, not 50 via linear interpolation), and CE < E[z] characterizes risk aversion only under concave u while here u is convex. <b>The third strategy</b> applies the second-difference test correctly but presents it as the primary method rather than leading with the stated midpoint test; strategy 3 also confirms risk-loving by the midpoint check in passing but departs from the direct formula the question requests. <b>The fourth strategy</b> correctly computes E[u]=1.5 > u(E[z])=1 and invokes Jensen to conclude risk-loving; this is correct in substance but attributes the conclusion to Jensen's inequality rather than to the midpoint test formula directly requested by the question, and does not cite the midpoint test by name. <span class=\"ref\">Guide §3.4</span>"
},
{ type: "micro", topic: "Insurance full coverage FOC",
  q: "A risk-averse agent with wealth w faces loss L with probability \\u03c0. Insurance covers q at premium p per unit. Derive optimal q* and the condition for full insurance.",
  opts: ["Maximize E[u] w.r.t. q; FOC: \\u03c0(1-p)u'(w-L+q-pq) = (1-\\u03c0)p u'(w-pq); at actuarially fair p=\\u03c0 this forces equal marginal utilities across states; since u is strictly concave, equal u' implies equal wealth, giving q*=L (full insurance).", "Set the FOC \\u03c0u'(loss state) = (1-\\u03c0)u'(no-loss state) by omitting the premium weighting factors (1-p) and p; this simplified equation holds at the optimum regardless of the premium level p; equal marginal utilities combined with strict concavity then force full insurance q*=L for all values of p.", "Apply Jensen's inequality: E[u(final wealth)] \\u2264 u(E[final wealth]) for any concave u; therefore the agent always prefers the certain expected-wealth outcome over any risky wealth distribution, implying full coverage q*=L is optimal for any level of the premium p.", "Compare the premium to the actuarial value: if p < \\u03c0 the agent over-insures with q* > L; if p=\\u03c0 full insurance q*=L; if p > \\u03c0 partial insurance q* < L; these three regimes follow from the FOC without specifying the exact utility function u."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: FOC \\u03c0(1-p)u' = (1-\\u03c0)pu'; p=\\u03c0 forces equal marginal utilities hence equal wealth and q*=L.</span> <b>The second strategy</b> drops the (1-p) and p weighting factors from the FOC; the correct FOC is \\u03c0(1-p)u'(loss) = (1-\\u03c0)p u'(no-loss); without the weights the equation holds only when p=\\u03c0 and erroneously implies full coverage for all p. <b>The third strategy</b> applies Jensen to conclude full coverage is always optimal; Jensen implies the agent prefers a certain wealth over a risky one of the same mean, but does not imply q*=L at all p — at unfair premiums full coverage lowers expected wealth, making partial coverage optimal. <b>The fourth strategy</b> claims over-insurance (q* > L) when p < \\u03c0; standard models constrain q \\u2264 L, in which case q*=L at fair or favorable pricing, not q* > L. <span class=\"ref\">Guide §4.4</span>"
},
{ type: "micro", topic: "Cournot best-response intersection",
  q: "Two firms have costs c\\u2081 < c\\u2082 with demand P = a - Q. Find the Cournot-Nash equilibrium quantities.",
  opts: ["Maximize joint profit \\u03a0 = (a-Q)(q\\u2081+q\\u2082)-c\\u2081q\\u2081-c\\u2082q\\u2082; set \\u2202\\u03a0/\\u2202q\\u1d62=0; the FOCs of joint maximization yield the Cournot equilibrium quantities because individual rationality coincides with joint maximization when costs are asymmetric.", "Apply Stackelberg backward induction: since firm 1 has the lower cost it naturally leads; solve firm 2's best response q\\u2082=(a-c\\u2082-q\\u2081)/2, substitute into firm 1's profit, and maximize to get q\\u2081*=(a-c\\u2081)/2 and q\\u2082*=(a-c\\u2082-q\\u2081*)/2 as the Cournot equilibrium quantities.", "Use the symmetric Cournot formula with average cost \\u0304c=(c\\u2081+c\\u2082)/2; since centering on the average correctly aggregates the two cost levels, each firm produces q*=(a-\\u0304c)/3 and they produce equal quantities in the equilibrium.", "Write firm i's profit \\u03c0\\u1d62=(a-q\\u1d62-q\\u2c7c-c\\u1d62)q\\u1d62; FOC yields BR\\u1d62: q\\u1d62=(a-c\\u1d62-q\\u2c7c)/2; solve the two BR equations simultaneously to get q\\u1d62*=(a-2c\\u1d62+c\\u2c7c)/3 for each firm i."],
  correct: 3,
  explain: "<span class=\"verdict\">Correct: derive individual BRs, intersect to get q\\u1d62*=(a-2c\\u1d62+c\\u2c7c)/3.</span> <b>The first strategy</b> maximizes joint profit; this gives the cartel/collusive quantities, not the Nash equilibrium; the FOCs of joint maximization internalize the profit externality and differ from the self-interested Cournot FOCs. <b>The second strategy</b> applies Stackelberg backward induction; Cournot assumes simultaneous quantity setting, not sequential commitment, so the Stackelberg leader output is not a Cournot outcome. <b>The third strategy</b> uses the symmetric formula with average cost; firms with different costs produce different Cournot quantities, so the equal-output average-cost solution is incorrect. <span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Stackelberg SPNE",
  q: "In a Stackelberg duopoly with P = a - Q and identical costs c, find the SPNE quantities and profits.",
  opts: ["Solve both BR equations simultaneously as in Cournot; Stackelberg and Cournot coincide when costs are identical, giving q\\u1d62*=(a-c)/3 for both firms; first-mover advantage cancels out with symmetric costs.", "Solve the follower's BR first: BR\\u2082(q\\u2081)=(a-c-q\\u2081)/2; substitute into leader's profit; FOC gives q\\u2081*=(a-c)/2; back out q\\u2082*=(a-c)/4; profits \\u03c0\\u2081=(a-c)\\u00b2/8 > \\u03c0\\u2082=(a-c)\\u00b2/16, confirming first-mover advantage.", "Leader produces q\\u2081*=(a-c)/3 (Cournot quantity) and follower responds with q\\u2082*=(a-c)/3; first-mover advantage means \\u03c0\\u2081=(a-c)\\u00b2/8 strictly exceeds \\u03c0\\u2082=(a-c)\\u00b2/16 in Stackelberg as in any sequential game.", "Apply backward induction: find the follower's BR; maximize leader's profit anticipating the follower; leader produces (a-c)/2 and follower produces (a-c)/4; verify \\u03c0\\u2081=(a-c)\\u00b2/8 > \\u03c0\\u2082 by the standard formula."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: solve follower BR first, substitute, FOC for leader; q\\u2081*=(a-c)/2, q\\u2082*=(a-c)/4.</span> <b>The first strategy</b> claims Stackelberg and Cournot coincide with identical costs; this is wrong — Stackelberg sequential play gives the leader first-mover advantage with q\\u2081*=(a-c)/2 (not (a-c)/3) even with identical costs. <b>The third strategy</b> states q\\u2081*=(a-c)/3 (the Cournot quantity) while claiming \\u03c0\\u2081=(a-c)\\u00b2/8 (the correct Stackelberg profit); these are internally inconsistent since the Cournot quantity produces profit (a-c)\\u00b2/9, not (a-c)\\u00b2/8. <b>The fourth strategy</b> describes the correct backward-induction procedure but omits the intermediate algebraic step showing how the FOC produces q\\u2081*=(a-c)/2 as the monopoly output; without the derivation step the strategy is incomplete as a proof. <span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Bertrand asymmetric costs",
  q: "Two firms have asymmetric costs c\\u2081 < c\\u2082. Characterize the Bertrand NE with continuous prices and with integer prices.",
  opts: ["With continuous prices the NE is p\\u2081=p\\u2082=c\\u2081; both price at the lower cost; firm 2 earns zero; with integer prices the same p=c\\u2081 holds since firm 2 cannot undercut further.", "Firm 1 prices at p\\u2081=c\\u2082-\\u03b5 just below firm 2's cost and captures the market; with continuous prices this yields no exact NE due to open best-response sets; with integer prices p\\u2081*=c\\u2082-1 (if c\\u2082-1 > c\\u2081) gives firm 1 strictly positive profit.", "With continuous prices there is no NE because open best-response correspondences prevent convergence; with integer prices both firms price at c\\u2082, split the market, and each earns (c\\u2082-c\\u2081)/2 profit per unit sold.", "Firm 1 undercuts to p\\u2081=c\\u2081 (its own cost) and firm 2 exits; the zero-profit outcome for firm 1 is the unique Bertrand NE regardless of cost asymmetry, because Bertrand competition always drives price to marginal cost."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: p\\u2081 approaches c\\u2082 from below; open best-response issue at continuous prices; integer-price NE is p\\u2081*=c\\u2082-1.</span> <b>The first strategy</b> claims both firms price at c\\u2081 with continuous prices; firm 1 can price above c\\u2081 (at nearly c\\u2082) and earn positive profit, so the zero-profit outcome is not the equilibrium with asymmetric costs. <b>The third strategy</b> claims both firms price at c\\u2082 and split the market in the integer case; firm 1 would prefer to undercut to c\\u2082-1 and capture the entire market, so pricing at c\\u2082 with market splitting is not an equilibrium. <b>The fourth strategy</b> asserts firm 1 prices at its own cost c\\u2081; with asymmetric costs firm 1 can price at nearly c\\u2082 and earn (c\\u2082-c\\u2081) per unit, which is strictly better than zero-profit pricing at c\\u2081. <span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "BNE Cournot private costs",
  q: "In Cournot with P = a-Q, firm 1 has known cost c\\u2081. Firm 2 has cost c\\u2097 w.p. \\u03bb or c\\u2097' w.p. 1-\\u03bb, private. Find the BNE.",
  opts: ["Firm 2 of type t plays q\\u2082\\u1d57=(a-c\\u1d57-q\\u2081)/2; firm 1 best-responds to the expectation of firm 2's output: q\\u2081*=(a-2c\\u2081+\\u03bbc\\u2097+(1-\\u03bb)c\\u2097')/3; substitute back to solve each type's quantity as three equations in three unknowns.", "Assume a pooling BNE where both types of firm 2 play the same quantity q\\u2082*=(a-E[c\\u2082]-q\\u2081)/2; firm 1 best-responds to q\\u2082*; the symmetric pooling solution reduces the system to two unknowns and always yields a unique equilibrium.", "Firm 1 maximizes \\u03bb\\u03c0\\u2081(q\\u2081,q\\u2082\\u1d38)+(1-\\u03bb)\\u03c0\\u2081(q\\u2081,q\\u2082\\u1d38'); the FOC gives q\\u2081*=(a-c\\u2081-E[q\\u2082])/2; this is the Bayesian Nash best response by definition; no further substitution is needed to complete the equilibrium.", "Apply iterated dominance: since Cournot outputs are dominant strategies for each type, firm 2's best reply is independent of q\\u2081; solve q\\u2082\\u1d57=(a-c\\u1d57)/2 ignoring firm 1's quantity; then firm 1 best-responds to E[q\\u2082] to complete the BNE."],
  correct: 0,
  explain: "<span class=\"verdict\">Correct: type-contingent BRs for firm 2, firm 1 best-responds to E[q\\u2082]; solve three equations in three unknowns.</span> <b>The second strategy</b> assumes a pooling BNE where both types play the same quantity; in the Cournot BNE each type has a different cost and best response, so pooling is not the equilibrium. <b>The third strategy</b> writes firm 1's FOC correctly but stops there; the BNE requires solving the complete three-equation system including both type-contingent firm-2 equations. <b>The fourth strategy</b> claims firm 2's output is a dominant strategy independent of q\\u2081; Cournot BRs are q\\u2082\\u1d57=(a-c\\u1d57-q\\u2081)/2, which depends directly on q\\u2081, so no dominant strategy exists. <span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Mixed strategy NE whose indifference",
  q: "In a 2x2 simultaneous game, find the mixed strategy NE. Player 1 mixes with p on U; player 2 mixes with q on L.",
  opts: ["Take the FOC of each player's expected payoff w.r.t. their own mixing probability and solve for (p*,q*); the interior FOC is the NE condition.", "Set player 1's expected payoff from U equal to payoff from D holding q fixed to pin q*; set player 2's expected payoff from L equal to payoff from R holding p fixed to pin p*; report (p*,q*) as the mixed NE.", "Equate player 1's expected payoffs to pin p* (player 1's mix); equate player 2's expected payoffs to pin q* (player 2's mix); report (p*,q*); each player's indifference condition pins their own mixing probability.", "Apply backward induction on the mixed extension: player 1 commits to p, player 2 best-responds; the SPNE of this sequential version equals the simultaneous mixed NE because indifference is maintained at every node."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: player 1's indifference pins q*, player 2's indifference pins p*; each player's mix is determined by the opponent's indifference.</span> <b>The first strategy</b> says each player maximizes their own payoff w.r.t. their mix probability; if a player is mixing they must be indifferent between their actions, so no interior FOC in p exists — each player's mixing probability is determined by the opponent's indifference condition, not self-maximization. <b>The third strategy</b> equates player 1's payoffs to pin p* (player 1's own mix); this reverses the logic: player 1's indifference pins q*, not p*; player 2's indifference pins p*. <b>The fourth strategy</b> applies backward induction to a sequential version; the mixed NE of the simultaneous game cannot be recovered from sequential backward induction. <span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "SPNE algorithm",
  q: "Characterize the SPNE of a three-stage extensive form game where player 1 moves first, player 2 moves second, and player 1 moves last.",
  opts: ["Find Nash equilibria of the full normal form; any NE where no player has a profitable deviation is also an SPNE, since SPNE is simply a refinement of NE that eliminates weakly dominated strategies from the solution set.", "Work backwards from player 1's last move; maximize player 1's final payoff; substitute into stage 2 and find player 2's optimal action; substitute into stage 1 for player 1's initial move; report only equilibrium-path actions since off-path actions are determined by dominance.", "Identify all proper subgames starting from the final nodes; find a NE of each subgame (including mixed if needed); replace each subgame with its NE payoffs; solve the reduced game; report the full contingent strategy profile including all off-path actions.", "Since player 1 moves twice, apply the Stackelberg formula with player 1 as leader; find the strategy maximizing player 1's total payoff given player 2's best response; this first-mover advantage result equals the SPNE in all three-stage sequential games."],
  correct: 2,
  explain: "<span class=\"verdict\">Correct: find subgame NE at every proper subgame, fold back, report full contingent strategies including off-path actions.</span> <b>The first strategy</b> claims every NE of the normal form is an SPNE up to removing dominated strategies; SPNE requires sequential rationality in every proper subgame and eliminates NE supported by non-credible off-path threats, not just dominated strategies. <b>The second strategy</b> performs backward induction correctly but states off-path actions are determined by dominance and need not be specified; a strategy is a complete contingent plan at every information set including off-path ones, and dominance does not determine them. <b>The fourth strategy</b> applies the Stackelberg formula to a general three-stage game; this is only valid in specific linear Cournot settings, not in general extensive forms. <span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "NE not SPNE construction",
  q: "Construct a Nash equilibrium of a sequential game that is not subgame perfect. Name the failing subgame.",
  opts: ["State that any Nash equilibrium supported by a non-credible off-path threat fails subgame perfection; the failing subgame is any information set never reached on the equilibrium path; no specific game or strategy profile needs to be constructed since the concept alone suffices as an answer.", "Construct the NE: (L, play A if L, play B if R); this is a NE if B discourages R on path and A rewards L; it fails SPNE if in the subgame following R, playing B is not sequentially rational for player 2 (e.g., A strictly dominates B in that subgame).", "Claim any NE with a weakly dominated strategy is automatically not SPNE; dominance and sequential rationality are equivalent in finite games, so identifying a dominated action identifies the failing subgame.", "In the ultimatum game, construct a NE where the proposer offers the full surplus to the responder, supported by the responder's commitment to reject any offer below the full amount; the failing subgame is the responder's decision node after receiving a positive but partial offer, where rejection is sequentially irrational."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: construct the explicit strategy (L, A|L, B|R); verify NE on path; name the subgame following R where B fails sequential rationality.</span> <b>The first strategy</b> vaguely describes the concept without constructing an explicit strategy profile or naming the exact failing subgame; graders require a specific game, strategy triple, and identified information set. <b>The third strategy</b> falsely equates dominance with sequential rationality; a strategy can be weakly dominated but still sequentially rational in some subgame, and a strategy can fail sequential rationality without being dominated. <b>The fourth strategy</b> describes the ultimatum game but the non-SPNE claim is incorrect: in the standard SPNE the proposer takes nearly everything; a full-surplus offer is not a NE in the proposer's interest, so the alleged NE is not internally consistent as described. <span class=\"ref\">Guide §4.2</span>"
},
{ type: "micro", topic: "Finite repetition unique stage NE",
  q: "Firms play a prisoner's dilemma for T < \\u221e periods. Can cooperation be sustained in any SPNE?",
  opts: ["Yes: for T sufficiently large the Folk theorem for finitely repeated games guarantees that any feasible payoff strictly above the minmax is achievable in a SPNE; since (4,4)-type payoffs are feasible and strictly above the minmax, cooperation is always sustainable in a SPNE for large enough T.", "Yes: with T > 1 periods both firms can cooperate in period 1 and threaten reversion to Nash in period 2; the IC for cooperation requires only \\u03b4 > 1/2, satisfied for standard discount factors; finite T does not preclude cooperation.", "No: backward induction in period T forces stage NE play; anticipating this, both defect in T-1; the unraveling continues to period 1; cooperation fails in every SPNE when the stage NE is unique.", "No: cooperation can be sustained in periods 1 through T-2 but not in T-1 or T; the unraveling argument stops exactly two periods before the end, so partial cooperation in early periods is possible even when the stage NE is unique."],
  correct: 2,
  explain: "<span class=\"verdict\">Correct: unique stage NE plus backward induction unravels cooperation in every period.</span> <b>The first strategy</b> misapplies the finitely repeated Folk theorem; the finitely repeated Folk theorem requires multiple stage NE for carrot-stick constructions; with a unique stage NE the construction fails and the theorem does not apply. <b>The second strategy</b> applies the infinite-horizon grim trigger IC to a finite game; in a finite game the threat to play Nash forever is not sequentially rational after period T since there is no next period. <b>The fourth strategy</b> claims unraveling stops two periods before the end; with a unique stage NE backward induction continues past T-1 all the way to period 1 without stopping, so cooperation fails in every period. <span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "State-dependent grim trigger",
  q: "Demand alternates high (H) and low (L) each period. Firms use grim trigger. Find \\u03b4** for collusion and identify which state's IC binds.",
  opts: ["Average the IC over both states using average profits \\u03c0\\u1d39=(\\u03c0\\u1d39\\u1d34+\\u03c0\\u1d39\\u2097)/2 and \\u03c0\\u1d30=(\\u03c0\\u1d30\\u1d34+\\u03c0\\u1d30\\u2097)/2; apply \\u03b4**=(\\u03c0\\u1d30-\\u03c0\\u1d39)/(\\u03c0\\u1d30-\\u03c0\\u1d3a) with these averages; stationarity of the discounted stream justifies this averaging approach.", "Check the IC state-by-state; the binding constraint is in the high-demand state where one-shot deviation gain is largest; compute \\u03b4** using H-state profits; the low-demand IC is automatically satisfied whenever the H-state IC holds.", "Check only the low-demand IC; the collusion surplus is smaller when demand is low, so the relative temptation to defect is larger and the low-demand IC is always the binding constraint for grim trigger sustainability.", "Write the two-period IC summing one H and one L period; compare the deviation gain in H plus next-period gain in L to the two-period collusion stream; solve for \\u03b4** using the full two-period cycle; this cycle approach avoids the state-by-state check."],
  correct: 1,
  explain: "<span class=\"verdict\">Correct: check IC state-by-state; the high-demand state has the largest deviation temptation and is binding.</span> <b>The first strategy</b> uses average-demand profits in the grim trigger formula; the IC must hold separately in each state, not merely at the average; the guide explicitly states that with state-dependent demand the IC binds in the high-demand state. <b>The third strategy</b> checks only the low-demand state and claims it is binding; while the collusion payoff is smaller in low demand, the deviation gain is also smaller, and the high-demand state net temptation dominates per the guide. <b>The fourth strategy</b> constructs a two-period cycle IC; while formally possible, the standard approach is to check the IC state-by-state and identify the binding state, which the cycle approach obscures. <span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Folk theorem minmax vs Nash",
  q: "For a repeated game with the payoff matrix given, describe the Folk region and distinguish minmax payoffs from Nash payoffs.",
  opts: ["Compute each player's minmax \\u1e7f\\u1d62 = min_{s_{-i}} max_{s_i} u\\u1d62; compute the convex hull of all stage-game payoff vectors (including mixed outcomes); the Folk region consists of feasible payoffs strictly dominating (\\u1e7f\\u2081,\\u1e7f\\u2082); Nash payoffs are weakly above minmax but generally unequal to them.", "The Folk region is the Pareto frontier of stage-game payoffs; minmax is computed as each player's Nash payoff in the stage game; because the two concepts coincide in symmetric zero-sum games, Nash payoffs serve as the Folk region threshold.", "Apply the Nash bargaining solution: maximize the Nash product of payoff gains above the Nash threat point to identify the Folk region boundary; since minmax and Nash payoffs are numerically equal in symmetric two-player games, using the Nash equilibrium payoff as the threat point is correct for characterizing the Folk region.", "The Folk region is defined as the set of individually rational feasible payoffs strictly above each player's Nash equilibrium payoff in the stage game; minmax is what each player can guarantee themselves by best-responding to the opponent's worst-case mixed strategy; in all two-player symmetric games these two payoffs turn out to be numerically equal."],

function shuffleQuiz() {
  for (let i = quiz.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
  }
}
shuffleQuiz();
let current = 0;
let score = 0;
let answered = false;
const results = [];

function render() {
  const q = quiz[current];
  const card = document.getElementById("card");
  let html = '';
  html += '<div class="card-meta"><span class="tag ' + q.type + '">' + (q.type === "metrics" ? "Econometrics" : "Microeconomics") + '</span><span class="topic-tag">' + q.topic + '</span></div>';
  html += '<div class="question">Q' + (current+1) + '. ' + q.q + '</div>';
  html += '<div class="options">';
  const letters = ['A','B','C','D'];
  for (let i = 0; i < q.opts.length; i++) {
    html += '<button class="opt" id="opt'+i+'" onclick="pick('+i+')"><span class="letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></button>';
  }
  html += '</div>';
  html += '<div class="explain" id="explain">' + q.explain + '</div>';
  card.innerHTML = html;

  answered = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("nextBtn").textContent = current === quiz.length - 1 ? "Finish ✓" : "Next →";
  const pct = (current / quiz.length * 100).toFixed(0);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("topicLabel").textContent = "Question " + (current+1) + " / " + quiz.length;
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([card]);
}

function pick(i) {
  if (answered) return;
  answered = true;
  const q = quiz[current];
  const right = i === q.correct;
  if (right) score++;
  results.push({ topic: q.topic, type: q.type, right: right });
  for (let j = 0; j < q.opts.length; j++) {
    const el = document.getElementById("opt" + j);
    el.disabled = true;
    if (j === q.correct) el.classList.add("correct");
    else if (j === i) el.classList.add("wrong");
    else el.classList.add("dim");
  }
  const ex = document.getElementById("explain");
  ex.classList.add("visible");
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  document.getElementById("nextBtn").disabled = false;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([ex]);
}

function next() {
  if (!answered) return;
  if (current < quiz.length - 1) { current++; render(); }
  else finish();
}

function finish() {
  const card = document.getElementById("card");
  const pctScore = Math.round(score / quiz.length * 100);
  let grade;
  if (pctScore >= 90) grade = "Ace territory. Keep it warm.";
  else if (pctScore >= 75) grade = "Solid — drill the misses below, then re-run.";
  else if (pctScore >= 60) grade = "Passing-adjacent. The misses map to guide sections — restudy those first.";
  else grade = "Back to the guides — Tier 1 sections first, then re-run this quiz.";
  let html = '<div class="bigscore">' + score + ' / ' + quiz.length + '</div>';
  html += '<div class="grade">' + pctScore + '% — ' + grade + '</div>';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    html += '<div class="result-line"><span>Q' + (i+1) + ' · ' + (r.type === "metrics" ? "Metrics" : "Micro") + ' · ' + r.topic + '</span><span class="' + (r.right ? 'ok' : 'miss') + '">' + (r.right ? '✓' : '✗') + '</span></div>';
  }
  html += '<div class="nav" style="margin-top:16px"><button onclick="restart()">↻ Restart quiz</button></div>';
  card.innerHTML = html;
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("topicLabel").textContent = "Done";
  document.getElementById("nextBtn").disabled = true;
}

function restart() {
  shuffleQuiz();
  current = 0; score = 0; answered = false; results.length = 0;
  render();
}

document.addEventListener("keydown", e => {
  if (["1","2","3","4"].includes(e.key) && !answered) { pick(parseInt(e.key)-1); }
  if ((e.key === "Enter" || e.key === "ArrowRight") && answered) next();
});

render();
</script>
</body>
</html>
