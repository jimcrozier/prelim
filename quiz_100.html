<script>
const quiz = [
{ type: "metrics", topic: "Two-way FE bias",
  q: "A researcher runs one-way unit-FE on $y_{it}=x_{it}'\\beta+c_i+\\lambda_t+u_{it}$, omitting time dummies. The plim of $\\hat\\beta_{FE}$ is:",
  opts: ["$\\beta$, because unit demeaning removes all confounders including time shocks", "$\\beta+(E[\\ddot x_{it}\\ddot x_{it}'])^{-1}E[\\ddot x_{it}c_i]$ — biased by residual unit effects after demeaning", "$\\beta+(E[\\ddot x_{it}\\ddot x_{it}'])^{-1}E[\\ddot x_{it}(\\lambda_t-\\bar\\lambda)]$", "$\\beta$, provided time shocks have mean zero and are uncorrelated across periods"],
  correct: 2,
  explain: "<span class=\"verdict\">Unit demeaning removes $c_i$ but not $\\lambda_t$; the residual shock $(\\lambda_t-\\bar\\lambda)$ biases FE if $\\ddot x_{it}$ co-moves with time shocks.</span>\nThe within-transformed error is $(\\lambda_t-\\bar\\lambda)+\\ddot u_{it}$. If regressors share a time pattern correlated with $\\lambda_t$, the bias is non-zero. The fix is two-way FE (adding time dummies). Mean-zero $\\lambda_t$ (fourth option) does not eliminate bias because $E[\\ddot x_{it}(\\lambda_t-\\bar\\lambda)]$ can be non-zero even when $E[\\lambda_t]=0$.<span class=\"ref\">Guide §4.5</span>"
},
{ type: "micro", topic: "Twice-repeated carrot-stick",
  q: "Stage game: two NE, Good $(4,4)$ and Bad $(1,1)$. Action $A=(6,6)$ in period 1; Good NE if no deviation, Bad NE after deviation. IC for each player requires:",
  opts: ["Deviation gain $\\le\\delta(4-1)=3\\delta$.", "Deviation gain $\\le0$.", "Discount factor $\\delta\\ge9/17$.", "Deviation gain $\\le(1-\\delta)\\pi^M$."],
  correct: 0,
  explain: "<span class=\"verdict\">Period-1 deviation gains extra profit; punishment is losing the Good-vs-Bad NE gap $(4-1)=3$ in period 2. IC: deviation gain $\\le3\\delta$.</span>\nSelf-enforcing ($\\le0$) would mean $A$ is a NE — it is not. The value $9/17$ is the Cournot infinite-horizon threshold, unrelated here. $(1-\\delta)\\pi^M$ belongs to infinite-horizon collusion formulas, not two-period carrot-stick.<span class=\"ref\">Guide §4.3</span>"
},
{ type: "micro", topic: "SPNE non-credible threat",
  q: "Entrant E: Enter or Stay Out. If entry, I: Fight ($\\pi_E=-1,\\pi_I=-1$) or Accommodate ($\\pi_E=2,\\pi_I=1$). Staying out: $(0,3)$. Which is a NE but NOT an SPNE?",
  opts: ["E enters; I accommodates.", "E stays out; I's strategy is to Fight upon entry.", "E enters; I fights.", "E stays out; I's strategy is to Accommodate upon entry."],
  correct: 1,
  explain: "<span class=\"verdict\">'E stays out; I threatens to Fight' is a NE on path (E earns 0 rather than $-1$). But in the entry subgame, Fighting gives I payoff $-1\\lt1$ — non-credible, violating sequential rationality. Not an SPNE.</span>\n'E enters; I accommodates' is the backward-induction SPNE. 'E enters; I fights' is not even a NE ($1\\gt-1$ for I). The last option is not a NE: E deviates to Enter (earning 2 vs 0).<span class=\"ref\">Guide §4.2, §6 items 7-8</span>"
},
{ type: "metrics", topic: "Panel RE vs FE — Hausman test",
  q: "A Hausman test rejects its null in a panel FE/RE comparison. The correct conclusion is:",
  opts: ["RE is more efficient; both are consistent — this describes the null outcome, not the rejection", "$E[c_i|x_i]\\neq 0$: unit effects correlate with regressors, making RE inconsistent", "Regressors are endogenous due to reverse causation; IV is needed instead of FE", "The panel is unbalanced, causing RE inconsistency through missing-at-random violations"],
  correct: 1,
  explain: "<span class=\"verdict\">Hausman rejection means $\\hat\\beta_{FE}$ and $\\hat\\beta_{RE}$ differ systematically, indicating $E[c_i|x_i]\\neq 0$ — the key RE assumption fails.</span>\nUnder the null, RE is consistent and efficient (first option describes the no-rejection case). Under the alternative, RE is inconsistent due to unit-effect–regressor correlation, while FE removes $c_i$ and remains consistent. The test statistic is $H=(\\hat\\beta_{FE}-\\hat\\beta_{RE})'(\\hat V_{FE}-\\hat V_{RE})^{-1}(\\hat\\beta_{FE}-\\hat\\beta_{RE})\\xrightarrow{d}\\chi^2_K$. Reverse causation and unbalance are separate issues.<span class=\"ref\">Guide §4.5</span>"
},
{ type: "micro", topic: "Expected utility",
  q: "Ann ranks lotteries by $W(p) = EV(p) - \\mathrm{Var}(p)$. Which is true?",
  opts: ["No utility representation exists — the relation is incomplete because variance creates indifference cycles", "A utility representation exists AND it is a valid EU representation with $u(z)=z-z^2$", "It is an EU representation with Bernoulli utility $u(z)=z-z^2$, since $E[u]=EV-\\text{Var}$ algebraically", "A utility representation exists, but it is NOT EU — variance is quadratic in $p$"],
  correct: 3,
  explain: "<span class=\"verdict\">Complete and transitive (it's a real-valued score) — so a utility rep exists — but not linear in $p$.</span>\n$\\mathrm{Var}(\\alpha p+(1-\\alpha)r)\\neq\\alpha\\mathrm{Var}(p)+(1-\\alpha)\\mathrm{Var}(r)$, so independence fails. Contrast with the AND-criterion (higher mean AND lower variance), which is incomplete and has no utility rep at all — that's option (a)'s scenario, not this one.<span class=\"ref\">Guide §3.4</span>"
},
{ type: "metrics", topic: "Selection bias — decomposition",
  q: "In the naive comparison $E[Y|D=1]-E[Y|D=0]=\\text{ATT}+\\text{selection bias}$, the selection-bias term equals:",
  opts: ["$E[Y(1)|D=1]-E[Y(1)|D=0]$ — gap in treated potential outcomes across groups", "$E[Y(1)-Y(0)|D=0]$ — the ATE for the untreated group", "$E[Y|D=1]-E[Y(0)|D=1]$ — the ATT itself, not the bias term", "$E[Y(0)|D=1]-E[Y(0)|D=0]$ — baseline counterfactual gap"],
  correct: 3,
  explain: "<span class=\"verdict\">Selection bias $=E[Y(0)|D=1]-E[Y(0)|D=0]$ — the pre-existing baseline gap in untreated potential outcomes between who chose treatment and who did not.</span>\nThe decomposition adds and subtracts $E[Y(0)|D=1]$: the result is ATT + selection bias where selection bias $=E[Y(0)|D=1]-E[Y(0)|D=0]$. The first option compares treated potential outcomes, a different quantity. The third option is the ATT itself, not the selection-bias component.<span class=\"ref\">Guide §3.3</span>"
},
{ type: "micro", topic: "Counterexample bank",
  q: "Lexicographic preferences on $\\mathbb{R}^2$ are the canonical counterexample showing:",
  opts: ["Complete + transitive preferences can fail continuity", "Transitive preferences can fail completeness — shown by strict partial orders on infinite sets", "Complete preferences can fail transitivity — shown by Condorcet-style majority aggregation", "Continuous preferences can fail transitivity — shown by intransitive indifference with just-noticeable differences"],
  correct: 0,
  explain: "<span class=\"verdict\">Complete ✓, transitive ✓, continuous ✗.</span>\nThe sequence $x^n=(1-\\frac{1}{n},1)\\to(1,1)$ with $y=(1,0)$: every $x^n\\prec y$ but the limit $\\succ y$ — upper contour sets aren't closed. Condorcet cycles are the complete-not-transitive example; Pareto partial orders are transitive-not-complete. Keep the bank straight.<span class=\"ref\">Guide §3.3</span>"
},
{ type: "micro", topic: "Generalized Leontief expenditure",
  q: "A consumer has $u=\\min(x_1^{1/2},x_2^{1/2})$ (generalized Leontief with $f(x)=\\sqrt{x}$). The expenditure function $e(p,u)$ is:",
  opts: ["$u(p_1+p_2)$", "$\\sqrt{u(p_1^2+p_2^2)}$", "$u^2(p_1+p_2)$", "$u(\\sqrt{p_1}+\\sqrt{p_2})$"],
  correct: 2,
  explain: "<span class=\"verdict\">At the kink $x_1^{1/2}=x_2^{1/2}=u$, so $x_i=u^2$. Expenditure $=p_1 u^2+p_2 u^2=u^2(p_1+p_2)$. Formula: $e=(p_1+p_2)f^{-1}(u)=(p_1+p_2)u^2$.</span>\nThe option $u(p_1+p_2)$ is the plain Leontief formula with identity $f$ — it forgets to invert $f=\\sqrt{\\cdot}$. The square-root form $\\sqrt{u(p_1^2+p_2^2)}$ is the convex-quadratic EMP. The fractional-power form $u(\\sqrt{p_1}+\\sqrt{p_2})$ has no basis in the Leontief EMP.<span class=\"ref\">Guide §3.1 variants</span>"
},
{ type: "micro", topic: "Shephard's lemma",
  q: "Expenditure function $e(p_1,p_2,u)=u\\sqrt{p_1^2+p_2^2}$ (convex-quadratic, $\\alpha_i=1$). Shephard's lemma gives $h_2(p,u)$ as:",
  opts: ["$h_2=u\\sqrt{p_1^2+p_2^2}$", "$h_2=u/(2p_2)$", "$h_2=up_2/\\sqrt{p_1^2+p_2^2}$", "$h_2=up_2$"],
  correct: 2,
  explain: "<span class=\"verdict\">Shephard's lemma: $h_i=\\partial e/\\partial p_i$. Differentiating $u\\sqrt{p_1^2+p_2^2}$ w.r.t. $p_2$: $h_2=up_2/\\sqrt{p_1^2+p_2^2}$.</span>\nThe first option returns $e$ itself. The option $u/(2p_2)$ would follow from differentiating $u\\ln(p_1^2+p_2^2)/2$. The option $up_2$ omits the denominator from the chain-rule factor.<span class=\"ref\">Guide §3.2</span>"
},
{ type: "micro", topic: "Mean-preserving spread SOSD",
  q: "Lottery $G$ is a mean-preserving spread of $F$ (same mean, higher variance). Which agents always prefer $F$ to $G$?",
  opts: ["EU-maximizers with non-decreasing $u$ (FOSD condition).", "No EU-maximizer — SOSD ordering is incomplete.", "EU-maximizers with concave $u$ (risk-averse) — SOSD condition.", "EU-maximizers with convex $u$ (risk-loving)."],
  correct: 2,
  explain: "<span class=\"verdict\">MPS is characterized by SOSD: $F$ SOSD $G$ iff all concave-$u$ (risk-averse) agents prefer $F$.</span>\nNon-decreasing $u$ characterizes FOSD; MPS does not imply FOSD. SOSD gives a definitive ranking for risk-averse agents, so it is not incomplete (second option). Risk-loving agents (convex $u$) prefer more spread — they prefer $G$.<span class=\"ref\">Guide §3.4</span>"
},
{ type: "metrics", topic: "Measurement error",
  q: "Classical measurement error: $x^*=x+\\varepsilon$ with $\\sigma_x^2=4$, $\\sigma_\\varepsilon^2=1$, true slope $\\beta_1=5$. The plim of the OLS slope of $Y$ on $x^*$ is:",
  opts: ["$5$ — classical error is harmless", "$4$ — attenuated by the reliability ratio $0.8$", "$6.25$ — inflated by the noise", "$0$ — OLS is uninformative"],
  correct: 1,
  explain: "<span class=\"verdict\">$\\mathrm{plim}\\,\\hat{\\beta}_1 = \\beta_1\\frac{\\sigma_x^2}{\\sigma_x^2+\\sigma_\\varepsilon^2} = 5\\times\\frac{4}{5} = 4$.</span>\nAttenuation bias: always toward zero, sign preserved, worse as the noise share grows. The composite error $u-\\beta_1\\varepsilon$ correlates with $x^*$ through $-\\beta_1\\sigma_\\varepsilon^2$.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "micro", topic: "Lexicographic continuity failure",
  q: "Lexicographic preference on $\\mathbb{R}^2$: sequence $x^n=(1-1/n,1)\\to(1,1)$, bundle $y=(1,0)$. Which failure is exhibited?",
  opts: ["$x^n\\succ y$ for all $n$ but $(1,1)\\prec y$ — wrong direction.", "The sequence has no limit in $\\mathbb{R}^2$.", "$x^n\\sim y$ for all $n$ but $(1,1)\\ne y$ — indifference class not closed.", "$x^n\\prec y$ for all $n$ but $(1,1)\\succ y$ — upper contour set of $y$ not closed."],
  correct: 3,
  explain: "<span class=\"verdict\">Lexicographically, $x^n=(1-1/n,1)\\prec(1,0)=y$ (first coordinate smaller). But $(1,1)\\succ y$ (equal first coordinates, higher second). The upper contour set of $y$ contains the limit but none of the sequence — not closed.</span>\nThe first option has the direction backward: $x^n\\prec y$, not $\\succ y$. The sequence converges to $(1,1)$ in $\\mathbb{R}^2$ without issue. The sequence is strictly below $y$ lexicographically, not indifferent to it.<span class=\"ref\">Guide §3.3</span>"
},
{ type: "metrics", topic: "Multiple testing — FWER exact",
  q: "A researcher runs $m=5$ independent tests, each at size $\\alpha=0.05$. The exact FWER is:",
  opts: ["$1-(0.95)^5\\approx 0.226$", "$5\\times 0.05=0.25$ (Bonferroni upper bound)", "$0.05$", "$0.05/5=0.01$ (Bonferroni-corrected per-test level)"],
  correct: 0,
  explain: "<span class=\"verdict\">FWER $=1-(1-\\alpha)^m=1-0.95^5\\approx 0.226$ under independence.</span>\nThe Bonferroni bound $m\\alpha=0.25$ (second option) overestimates FWER under independence. The value $0.05$ (third option) applies to a single test. The value $0.01$ (fourth option) is the Bonferroni-corrected per-test threshold that would control FWER at $0.05$ — it is the threshold, not the FWER that results from running tests at $0.05$.<span class=\"ref\">Guide §4.3</span>"
},
{ type: "micro", topic: "Asymmetric Cournot BNE",
  q: "Cournot, $P=a-Q$; firm 1 has known cost $c_1=0$; firm 2's cost: $c_L=0$ w.p. $1/2$, $c_H=6$ w.p. $1/2$; $a=30$. Firm 1's BNE quantity $q_1^*=$",
  opts: ["$12$", "$11$", "$9$", "$10$"],
  correct: 1,
  explain: "<span class=\"verdict\">$E[c_2]=0.5(0)+0.5(6)=3$. BNE: $q_1^*=(a-2c_1+E[c_2])/3=(30+3)/3=11$.</span>\nThe value 12 reflects incorrect Bayesian arithmetic. The value 9 responds only to the high type, failing to average. The value 10 uses $(a-c_1)/3=10$, ignoring that firm 1 best-responds to expected cost rather than the known cost alone.<span class=\"ref\">Guide §4.1</span>"
},
{ type: "metrics", topic: "RDD — McCrary density test",
  q: "A researcher finds a sharp discontinuity in the density of the running variable at the RDD cutoff. The implication is:",
  opts: ["Agents are sorting precisely around the cutoff — invalidating causal inference", "Bandwidth is too narrow; widening it eliminates the apparent discontinuity because density is smooth globally", "Outcome outliers just above and below the cutoff are inflating the density estimate near $c$ and should be trimmed", "The running variable has a skewed distribution near $c$; log-transforming it normalizes density and removes the jump"],
  correct: 0,
  explain: "<span class=\"verdict\">A density discontinuity (McCrary test) indicates selective sorting at the cutoff: units just above and below are not comparable, violating the continuity assumption.</span>\nIf agents can precisely control whether they exceed the cutoff, potential outcomes are not continuous at $c$ and the RDD estimate is biased. Widening the bandwidth does not repair the underlying selection problem. Trimming or transforming the running variable does not address who chooses to be on which side of $c$.<span class=\"ref\">Guide §4.7</span>"
},
{ type: "metrics", topic: "Driscoll–Kraay standard errors",
  q: "When should a researcher use Driscoll–Kraay SEs instead of standard unit-cluster-robust SEs in a panel?",
  opts: ["When errors exhibit both cross-sectional dependence and within-unit serial correlation", "When the panel is strongly unbalanced — many missing periods cause standard cluster SEs to be unreliable", "When the number of clusters is large relative to sample size, so standard asymptotics over-reject", "When the outcome variable is binary and heteroskedasticity of a logit-type form is likely"],
  correct: 0,
  explain: "<span class=\"verdict\">Driscoll–Kraay handles both within-unit serial correlation and cross-unit contemporaneous dependence (spatial or common-shock).</span>\nStandard cluster-robust SEs allow arbitrary within-cluster correlation but assume independence across clusters. When all firms are hit by the same macro shock in period $t$, cross-unit covariances at the same period are non-zero and cluster SEs understate uncertainty. Driscoll–Kraay uses a spatial-HAC approach over time. Unbalance, many clusters, and binary outcomes are separate issues.<span class=\"ref\">Guide §4.5</span>"
},
{ type: "micro", topic: "Mean-variance EU failure",
  q: "Criterion $W(p)=E_p[z]-\\text{Var}_p(z)$ has a utility representation but NOT an EU representation. Why?",
  opts: ["$W$ is not monotone: adding a dominant outcome can lower $W$ by raising variance.", "$W$ contains $(\\sum z\\,p(z))^2$, quadratic in $p$, violating independence.", "$W$ lacks transitivity because the real-valued score produces cycles under compound lotteries.", "$W$ is not continuous: small probability shifts near integer prizes create discontinuous variance jumps."],
  correct: 1,
  explain: "<span class=\"verdict\">$W$ assigns real numbers to lotteries (complete, transitive — utility rep exists). But $\\text{Var}_p(z)=(\\sum z^2 p(z))-(\\sum z\\,p(z))^2$; the term $(\\sum z\\,p(z))^2$ is quadratic in $p$, making $W$ nonlinear and violating independence.</span>\nFOSD monotonicity is not the relevant failure here. Transitivity holds since $W$ is real-valued. $W$ is polynomial in probabilities — continuous. The specific failure is the quadratic variance term breaking linearity in $p$.<span class=\"ref\">Guide §3.4, §6 item 6</span>"
},
{ type: "micro", topic: "Finite repetition",
  q: "A stage game has a UNIQUE Nash equilibrium. The game is repeated $T=100$ times. In the unique SPNE:",
  opts: ["Cooperation can be sustained in early periods if players are patient", "Any feasible individually-rational payoff can be sustained (Folk theorem)", "Cooperation is sustained in all but the last period", "The stage NE is played in every period — cooperation is impossible"],
  correct: 3,
  explain: "<span class=\"verdict\">Backward induction unravels everything.</span>\nPeriod 100 must be the stage NE regardless of history; then period 99 has no credible carrot or stick; induction propagates to period 1. The Folk theorem needs an INFINITE horizon — or, in finite games, MULTIPLE stage NE to use as carrot and stick (the Aug 2025 twist).<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Convex utility",
  q: "$u=x_1^2+x_2^2$, $p=(1,2)$, $w=10$. The Walrasian demand is:",
  opts: ["The tangency point $(2,4)$ from the FOCs", "$(10,\\,0)$ — corner on the cheaper good", "$(0,\\,5)$ — corner on the higher-$\\alpha$ good", "$(5,\\,2.5)$ — spend half on each"],
  correct: 1,
  explain: "<span class=\"verdict\">Convex $u$ ⇒ the interior critical point is the MINIMUM on the budget line.</span>\nCompare corners: $(10,0)$ gives $u=100$; $(0,5)$ gives $u=25$. Rule: $i^*=\\arg\\max_i \\alpha_i/p_i^2$, $v=w^2\\max_i\\alpha_i/p_i^2=100$. FOCs are necessary but sufficiency needs quasi-concavity — convex utility fails it, so verify by comparing corners. (The EMP, by contrast, is interior.)<span class=\"ref\">Guide §3.1–3.2</span>"
},
{ type: "micro", topic: "State-dependent collusion",
  q: "Cournot firms face stochastic demand with high intercept $a_H$ (w.p. $1/2$) and low $a_L$ (w.p. $1/2$), $a_H\\gt a_L$. In grim-trigger collusion, which state's incentive constraint binds?",
  opts: ["Low state $L$ — smaller profits make defection relatively more tempting.", "Neither state — for $\\delta$ near 1 both ICs are slack.", "High state $H$ — deviation gain $\\propto(a-c)^2$ is largest when $a=a_H$.", "Both states equally."],
  correct: 2,
  explain: "<span class=\"verdict\">Deviation gain $\\propto(a-c)^2$ is maximized in state $H$. Continuation value is symmetric. IC is tightest in $H$: if it holds there, it holds everywhere.</span>\nIn state $L$ the deviation gain is smaller — IC slack. Near $\\delta=1$ both relax, but for any $\\delta\\lt1$ the binding state is $H$. Symmetric treatment ignores state-specific temptation.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "micro", topic: "Stackelberg follower quantity",
  q: "Stackelberg: $P=a-Q$, both MC $=c$; leader plays $q_1^*=(a-c)/2$. Follower's SPNE quantity is:",
  opts: ["$(a-c)/2$", "$(a-c)/3$", "$0$", "$(a-c)/4$"],
  correct: 3,
  explain: "<span class=\"verdict\">Follower's BR: $q_2=(a-c-q_1)/2$. With $q_1=(a-c)/2$: $q_2=(a-c)/4$. Leader profit $=(a-c)^2/8$, follower profit $=(a-c)^2/16$.</span>\n$(a-c)/2$ for both means total output $=a-c$, driving price to $c$ — Bertrand outcome. $(a-c)/3$ is the simultaneous Cournot quantity. The leader's output does not drive the follower to zero.<span class=\"ref\">Guide §4.2</span>"

{ type: "metrics", topic: "Panel FE — strict exogeneity",

{ type: "metrics", topic: "Measurement error — forgotten IV condition",
  q: "Under CEV, a second noisy measure $z=x+\\eta$ ($\\eta$ independent of $\\varepsilon$, $u$, $x$) is proposed as an instrument. Which condition is most often forgotten?",
  opts: ["$\\text{Cov}(z,x)\\neq 0$ (relevance) — usually checked with a first-stage $F$-test", "$\\text{Cov}(z,u)=0$ (exclusion from the structural equation error)", "$E[\\eta]=0$ (mean-zero measurement noise in the instrument)", "$\\text{Cov}(z,\\varepsilon)=0$ (measurement noise uncorrelated with $y$-equation error)"],

  explain: "<span class=\"verdict\">$\\text{Cov}(z,\\varepsilon)=0$ is the most-often-forgotten condition — explicitly flagged as a named deduction in the guide.</span>\nRelevance and structural exclusion are standard conditions students recall. But because $z$ is a noisy measure of $x$, if $\\text{Cov}(\\eta,\\varepsilon)\\neq 0$ then $\\text{Cov}(z,x^*)\\neq\\text{Cov}(z,x)$ and the IV estimator does not recover $\\beta_1$. Mean-zero noise (third option) is a CEV normalization, not the critical validity condition.<span class=\"ref\">Guide §4.1</span>"

{ type: "micro", topic: "Mixed NE indifference logic",
  q: "In a 2x2 game, player 1 mixes with probability $p$ on Up. At a mixed NE, $p$ is determined by:",

},
{ type: "micro", topic: "Grim trigger Cournot delta*",

{ type: "metrics", topic: "Holm vs Bonferroni",
  q: "Both Holm step-down and Bonferroni correction control FWER at $\\alpha$. Which statement is correct?",
  opts: ["Bonferroni is uniformly more powerful than Holm — its fixed threshold rejects more hypotheses", "Holm is uniformly more powerful but requires tests to be independent to maintain FWER control", "They are numerically identical for any data set when the smallest $p$-value equals $\\alpha/m$", "Holm is uniformly more powerful and requires no independence assumption to control FWER"],

  explain: "<span class=\"verdict\">Holm dominates Bonferroni: it controls FWER via the union bound (no independence required) and rejects at least as many hypotheses in every data set.</span>\nHolm's step-down compares the $k$-th smallest $p$-value to $\\alpha/(m-k+1)$, a less stringent threshold than Bonferroni's uniform $\\alpha/m$ for all but the smallest $p$-value. Both use only the union bound — neither requires independence (second option is wrong). They are not numerically identical in general (third option).<span class=\"ref\">Guide §4.3</span>"

{ type: "micro", topic: "Cobb-Douglas UMP demand",

  explain: "<span class=\"verdict\">Budget-share formula with equal exponents: $x_2^*=\\frac{1}{2}\\cdot\\frac{w}{p_2}=\\frac{w}{2p_2}$.</span>\nThe option $w/(p_1+p_2)$ confuses the denominator with the sum of prices — a Leontief with $a_i=1$ error. The option $w/(2p_1)$ is demand for good <i>1</i>, not good 2. The ratio $p_1 w/p_2^2$ has no derivation from the CD tangency condition.<span class=\"ref\">Guide §3.1</span>"

  explain: "<span class=\"verdict\">Perfect complements: you must buy the whole bundle — costs ADD.</span>\nAt the kink $a_1x_1=a_2x_2=u$, so $h_i=u/a_i$ and $e=p_1\\frac{u}{a_1}+p_2\\frac{u}{a_2}=u\\sum_j p_j/a_j$. The $\\min$ formula (option b) belongs to LINEAR utility, where you buy utils only from the cheapest source — the classic quartet mix-up.<span class=\"ref\">Guide §3.1 quartet</span>"

{ type: "micro", topic: "Stochastic Stackelberg value of information",

},
{ type: "metrics", topic: "IV — weak instruments",

{ type: "metrics", topic: "FWL theorem",

{ type: "metrics", topic: "Selection bias — when zero",
  q: "In the naive comparison $E[Y|D=1]-E[Y|D=0]=\\text{ATT}+\\text{selection bias}$, selection bias equals zero if and only if:",

{ type: "micro", topic: "Grim trigger Bertrand delta*",

{ type: "metrics", topic: "LATE assumptions",

{ type: "micro", topic: "Finite-X counting representation",

{ type: "metrics", topic: "Delta method — ratio g",

{ type: "metrics", topic: "MLE — Poisson avar",

{ type: "micro", topic: "Moral hazard observable effort",

{ type: "micro", topic: "Leontief EMP",

{ type: "metrics", topic: "WOLS asymptotic variance",

  opts: ["$E[e_i^2|X_i]=\\sigma^2$ and $w_i=1$", "$E[e_i|X_i]=0$: conditional mean-zero errors imply $B=\\sigma_e^2 E[w_i^2 X_iX_i']$, which collapses the sandwich", "$f(X_i)$ is strictly increasing in $X_i$, ensuring the weight matrix is positive definite and numerically stable", "$n$ exceeds $K$: the law of large numbers then guarantees the sandwich converges to the classical form"],

{ type: "metrics", topic: "Over-identified IV",

{ type: "micro", topic: "Utility representation",
  q: "If $u$ represents $\\succsim$ (i.e., $x\\succsim y \\iff u(x)\\ge u(y)$), which properties MUST $\\succsim$ have?",

{ type: "metrics", topic: "LR / Wald / LM trinity",
  q: "Which of the three classical MLE tests requires fitting <i>only</i> the restricted model?",
  opts: ["Wald", "LR", "LM (score test)", "All three require both restricted and unrestricted model fits"],
  correct: 2,
  explain: "<span class=\"verdict\">The LM (score) test uses only $\\hat\\theta_R$: if the restriction binds, the score at $\\hat\\theta_R$ should be near zero, and LM measures that deviation.</span>\nWald uses only the unrestricted $\\hat\\theta_U$ (first option). LR $=-2[\\ell(\\hat\\theta_R)-\\ell(\\hat\\theta_U)]$ requires both fits. LM $=s(\\hat\\theta_R)'I(\\hat\\theta_R)^{-1}s(\\hat\\theta_R)$ needs only the restricted estimates — a computational advantage when the restricted model is simpler to fit. All three converge to $\\chi^2(q)$ under $H_0$.<span class=\"ref\">Guide §5 (LR/Wald/LM)</span>"
},
{ type: "micro", topic: "Roy's identity",
  q: "Indirect utility $v(p_1,p_2,w)=w/(p_1^{1/2}p_2^{1/2})$. Roy's identity gives $x_1^*(p,w)$ as:",

  explain: "<span class=\"verdict\">Roy: $x_1^*=-(\\partial v/\\partial p_1)/(\\partial v/\\partial w)$. Here $\\partial v/\\partial p_1=-w/(2p_1^{3/2}p_2^{1/2})$ and $\\partial v/\\partial w=1/(p_1^{1/2}p_2^{1/2})$, so $x_1^*=w/(2p_1)$.</span>\nThe option $w/p_1$ omits the $1/2$ budget-share factor. The undivided partial omits the denominator $\\partial v/\\partial w$ — the most common Roy mistake. The last option is $|\\partial v/\\partial p_1|$ without the income normalization.<span class=\"ref\">Guide §3.2</span>"
},
{ type: "micro", topic: "EU linearity in p",

  opts: ["No EU representation: convexity of $z^2$ in $z$ violates the concavity condition required for any Bernoulli utility", "EU exists: $u(z)=z^2$ is a valid Bernoulli utility; $E_p[u]$ is linear in $p$", "No EU representation: $E[z^2]=\\text{Var}(z)+(E[z])^2$, where $(E[z])^2$ is quadratic in $p$, violating linearity", "EU exists only when prizes are non-negative, so $z^2$ maps to $[0,\\infty)$ and the expected value is well-defined"],
  correct: 1,
  explain: "<span class=\"verdict\">$V(p)=E_p[z^2]=\\sum_z z^2 p(z)$ is linear in the probability vector $p$. Setting $u(z)=z^2$ gives a valid EU representation.</span>\nThe third option confuses $E[z^2]$ (second raw moment, linear in $p$) with $\\text{Var}(z)=E[z^2]-(E[z])^2$, where $(E[z])^2$ is quadratic in $p$ — but $E[z^2]$ itself is linear. Convexity of $z^2$ in $z$ does not prevent it from being a Bernoulli utility. Non-negativity of prizes has no bearing on the EU question.<span class=\"ref\">Guide §3.4</span>"
},
{ type: "micro", topic: "Duality identity LNS",
  q: "The identity $e(p,v(p,w))=w$ holds under which condition?",
  opts: ["Strict quasi-concavity — it ensures a unique interior solution so the duality maps coincide exactly.", "Continuity of utility — required by Debreu's theorem to represent preferences with a continuous function.", "Differentiability of $e$ — needed for Shephard's lemma, which in turn implies the identity by integration.", "Local non-satiation (LNS) — ensures both budget and utility constraints bind at the optimum"],
  correct: 3,
  explain: "<span class=\"verdict\">LNS forces the budget to bind in the UMP and the utility constraint to bind in the EMP. Without LNS a satiated consumer need not spend all income, so $e(p,v(p,w))\\lt w$ is possible.</span>\nStrict quasi-concavity pins interior solutions but does not prevent satiation. Continuity is needed for Debreu's representation theorem, not for duality. Differentiability of $e$ supports Shephard's lemma, not the basic identity.<span class=\"ref\">Guide §3.2</span>"
},
{ type: "micro", topic: "Finite repetition no cooperation",
  q: "A game is played $T=5$ times; the stage game has a unique NE with payoffs $(1,1)$. Under SPNE, which outcome occurs in every period?",
  opts: ["$(C,C)$ in periods 1-4, stage NE in period 5 — the last-period NE is unavoidable but cooperation holds before", "$(C,C)$ whenever $\\delta\\ge9/17$ — the Cournot collusion threshold applies to finitely repeated games too", "$(C,C)$ in all periods when $T$ is large, since the shadow of the future outweighs one-shot gain", "Stage NE every period — backward induction unravels"],
  correct: 3,
  explain: "<span class=\"verdict\">Unique stage NE: backward induction gives $(D,D)$ in period 5; no threat in period 4, so $(D,D)$ there too; unravels to period 1. SPNE is $(D,D)$ every period.</span>\nCooperation in all-but-the-last ignores that period 4 also unravels once period 5 is fixed. Discount-factor arguments apply to infinite-horizon games. Making $T$ large does not help with a unique stage NE — the exception requires <i>multiple</i> stage NE for a carrot-stick construction.<span class=\"ref\">Guide §3.5</span>"
},
{ type: "metrics", topic: "MLE — exponential",
  q: "For i.i.d. Exponential$(\\lambda)$ with density $\\lambda e^{-\\lambda x}$, $x\\ge 0$, the MLE of $\\lambda$ is:",
  opts: ["$\\hat\\lambda=\\bar X$", "$\\hat\\lambda=n/\\sum_i X_i^2$", "$\\hat\\lambda=\\sqrt{n/\\sum_i X_i}$", "$\\hat\\lambda=1/\\bar X$"],
  correct: 3,
  explain: "<span class=\"verdict\">Log-likelihood $n\\log\\lambda-\\lambda\\sum x_i$; FOC $n/\\hat\\lambda-\\sum x_i=0$ gives $\\hat\\lambda=1/\\bar X$.</span>\nBy invariance, MLE of $\\mu=1/\\lambda$ is $\\bar X$, confirming the answer. The first option is the Poisson MLE. The second and third options do not arise from MLE for the exponential. SOC: $\\ell''=-n/\\lambda^2\\lt 0$, confirming a maximum.<span class=\"ref\">Guide §4.2</span>"
},
{ type: "metrics", topic: "ITT vs LATE",
  q: "In a randomized trial with imperfect compliance (binary $Z$, binary $D$), the ITT estimator is $E[Y|Z=1]-E[Y|Z=0]$. How does ITT relate to LATE?",
  opts: ["ITT $=$ LATE: randomization ensures $Z\\perp e$ so the intent-to-treat and local average effects coincide", "ITT $=$ LATE $\\div$ P(complier): dividing by the compliance rate scales up to recover the treatment effect", "ITT equals the ATT when always-takers are absent and all treated comply", "ITT $=$ P(complier) $\\times$ LATE: the Wald numerator diluted by non-compliers"],
  correct: 3,
  explain: "<span class=\"verdict\">The Wald numerator (ITT) $=$ P(complier) $\\times$ LATE; dividing by P(complier) recovers LATE.</span>\nITT includes all randomized units, diluting the effect by non-compliers (always-takers and never-takers who have zero treatment variation). The Wald formula divides ITT by the first stage to recover LATE. The second option inverts the relationship. Under positive effects and partial compliance, ITT is strictly smaller in magnitude than LATE because it averages over non-responders.<span class=\"ref\">Guide §3.3</span>"
}
];

function shuffleQuiz() {
  for (let i = quiz.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
  }
}
shuffleQuiz();
let current = 0;
let score = 0;
let answered = false;
const results = [];

function render() {
  const q = quiz[current];
  const card = document.getElementById("card");
  let html = '';
  html += '<div class="card-meta"><span class="tag ' + q.type + '">' + (q.type === "metrics" ? "Econometrics" : "Microeconomics") + '</span><span class="topic-tag">' + q.topic + '</span></div>';
  html += '<div class="question">Q' + (current+1) + '. ' + q.q + '</div>';
  html += '<div class="options">';
  const letters = ['A','B','C','D'];
  for (let i = 0; i < q.opts.length; i++) {
    html += '<button class="opt" id="opt'+i+'" onclick="pick('+i+')"><span class="letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></button>';
  }
  html += '</div>';
  html += '<div class="explain" id="explain">' + q.explain + '</div>';
  card.innerHTML = html;

  answered = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("nextBtn").textContent = current === quiz.length - 1 ? "Finish ✓" : "Next →";
  const pct = (current / quiz.length * 100).toFixed(0);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("topicLabel").textContent = "Question " + (current+1) + " / " + quiz.length;
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([card]);
}

function pick(i) {
  if (answered) return;
  answered = true;
  const q = quiz[current];
  const right = i === q.correct;
  if (right) score++;
  results.push({ topic: q.topic, type: q.type, right: right });
  for (let j = 0; j < q.opts.length; j++) {
    const el = document.getElementById("opt" + j);
    el.disabled = true;
    if (j === q.correct) el.classList.add("correct");
    else if (j === i) el.classList.add("wrong");
    else el.classList.add("dim");
  }
  const ex = document.getElementById("explain");
  ex.classList.add("visible");
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  document.getElementById("nextBtn").disabled = false;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([ex]);
}

function next() {
  if (!answered) return;
  if (current < quiz.length - 1) { current++; render(); }
  else finish();
}

function finish() {
  const card = document.getElementById("card");
  const pctScore = Math.round(score / quiz.length * 100);
  let grade;
  if (pctScore >= 90) grade = "Ace territory. Keep it warm.";
  else if (pctScore >= 75) grade = "Solid — drill the misses below, then re-run.";
  else if (pctScore >= 60) grade = "Passing-adjacent. The misses map to guide sections — restudy those first.";
  else grade = "Back to the guides — Tier 1 sections first, then re-run this quiz.";
  let html = '<div class="bigscore">' + score + ' / ' + quiz.length + '</div>';
  html += '<div class="grade">' + pctScore + '% — ' + grade + '</div>';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    html += '<div class="result-line"><span>Q' + (i+1) + ' · ' + (r.type === "metrics" ? "Metrics" : "Micro") + ' · ' + r.topic + '</span><span class="' + (r.right ? 'ok' : 'miss') + '">' + (r.right ? '✓' : '✗') + '</span></div>';
  }
  html += '<div class="nav" style="margin-top:16px"><button onclick="restart()">↻ Restart quiz</button></div>';
  card.innerHTML = html;
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("topicLabel").textContent = "Done";
  document.getElementById("nextBtn").disabled = true;
}

function restart() {
  shuffleQuiz();
  current = 0; score = 0; answered = false; results.length = 0;
  render();
}

document.addEventListener("keydown", e => {
  if (["1","2","3","4"].includes(e.key) && !answered) { pick(parseInt(e.key)-1); }
  if ((e.key === "Enter" || e.key === "ArrowRight") && answered) next();
});

render();
</script>
</body>
</html>
