<script>
const quiz = [
{ type: "metrics", topic: "WOLS asymptotic normality",
  q: "Consider \\(\\hat{\\beta}\\) minimizing \\(\\sum_i f(X_i)(Y_i - X_i'b)^2\\) with \\(w_i = f(X_i) \\gt 0\\). Which strategy correctly establishes \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0, A^{-1}BA^{-1})\\)?",
  opts: ["Apply the Lindeberg-Levy CLT to the iid mean-zero sequence \\(\\{w_i X_i e_i\\}\\) to obtain \\(\\frac{1}{\\sqrt{n}}\\sum_i w_i X_i e_i \\xrightarrow{d} N(0,B)\\); apply LLN to \\(\\frac{1}{n}\\sum w_i X_i X_i'\\) and use CMT to invert; combine via Slutsky to conclude \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0, A^{-1}BA^{-1})\\).", "Apply the CLT to \\(\\{w_i X_i e_i\\}\\) to get the normal limit; apply LLN to the Hessian average to get \\(\\hat{A} \\xrightarrow{p} A\\); then invoke the continuous mapping theorem to combine the distributional limit with the probability limit and conclude \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0,A^{-1}BA^{-1})\\).", "Apply the law of large numbers to \\(\\frac{1}{\\sqrt{n}}\\sum_i w_i X_i e_i\\) to establish that \\(\\sqrt{n}(\\hat{\\beta}-\\beta)\\) converges in distribution to \\(N(0,A^{-1}BA^{-1})\\); LLN applied to the Hessian then supplies the \\(A^{-1}\\) bookends.", "Apply the CLT to the unweighted score \\(\\{X_i e_i\\}\\) to obtain \\(N(0,E[X_iX_i'e_i^2])\\); then scale by the weight function \\(f(X_i)\\) to recover the weighted asymptotic variance; combine via Slutsky to get \\(N(0,A^{-1}BA^{-1})\\)."],
  correct: 0,
  explain: "The correct strategy applies CLT to the weighted score \\(\\{w_i X_i e_i\\}\\), LLN to the Hessian, and Slutsky to combine. <b>Flaw 1:</b> invoking the CMT to combine a distributional limit (CLT output) with a probability limit (LLN output) is wrong; CMT applies to a continuous function of a single plim; Slutsky's theorem is the rule for combining \\(\\xrightarrow{d}\\) and \\(\\xrightarrow{p}\\) limits. <b>Flaw 2:</b> the law of large numbers gives convergence in probability, not convergence in distribution; applying LLN to \\(\\frac{1}{\\sqrt{n}}\\sum w_i X_i e_i\\) would give zero in the limit, not a normal distribution; the CLT is needed for the \\(\\sqrt{n}\\)-scaled sum. <b>Flaw 3:</b> the score vector for WOLS is \\(w_i X_i e_i\\), not \\(X_i e_i\\); applying CLT to the unweighted score and then multiplying by \\(f(X_i)\\) is not a valid operation since \\(f(X_i)\\) is random and varies by observation. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "metrics", topic: "Delta method consistency",
  q: "\\(\\hat{\\beta}\\) is consistent for \\(\\beta\\). You wish to estimate \\(g(\\beta) = e^\\beta\\). Which step establishes that \\(e^{\\hat{\\beta}}\\) is a consistent estimator?",
  opts: ["Apply the central limit theorem: since \\(\\hat{\\beta}\\) is consistent, \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0,V)\\), and the CLT result combined with the continuous function \\(e^x\\) and the continuous mapping theorem together imply that \\(e^{\\hat{\\beta}} \\xrightarrow{p} e^\\beta\\) holds as a consequence.", "Since \\(e^x\\) is continuous everywhere and \\(\\hat{\\beta} \\xrightarrow{p} \\beta\\), the continuous mapping theorem directly gives \\(e^{\\hat{\\beta}} \\xrightarrow{p} e^\\beta\\); this is the consistency step and is logically separate from the delta method, which derives the asymptotic distribution.", "Note that \\(e^x\\) is convex, so by Jensen's inequality \\(E[e^{\\hat{\\beta}}] \\ge e^{E[\\hat{\\beta}]}\\); this means the plug-in is biased upward, not unbiased, and so unbiasedness cannot establish consistency.", "Apply the delta method: since \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0,V)\\), the delta method gives \\(\\sqrt{n}(e^{\\hat{\\beta}} - e^\\beta) \\xrightarrow{d} N(0, e^{2\\beta}V)\\), which implies \\(e^{\\hat{\\beta}} \\xrightarrow{p} e^\\beta\\) as a byproduct."],
  correct: 1,
  explain: "Consistency of a plug-in estimator requires only the CMT applied to the probability limit. <b>Flaw 1:</b> the CLT delivers a distributional (not probability) limit; convergence in distribution does not imply convergence in probability; the CLT result is not the route to consistency. <b>Flaw 2:</b> Jensen's inequality applied to a convex function gives \\(E[e^{\\hat{\\beta}}] \\ge e^{E[\\hat{\\beta}]}\\), which means the plug-in is biased <i>upward</i>, not unbiased; an upward-biased estimator can still be consistent but the claim of unbiasedness is false. <b>Flaw 3:</b> the delta method establishes the asymptotic distribution; while it is true that a distributional limit implies \\(e^{\\hat{\\beta}} - e^\\beta = o_p(1)\\), the delta method is not the logically primary route to consistency; the CMT step must be stated first and separately. <span class=\"ref\">Guide §3.2</span>"
},
{ type: "metrics", topic: "Delta method asymptotic distribution",
  q: "Given \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0,V)\\) and \\(g(\\beta) = \\beta^2\\), derive the asymptotic distribution of \\(\\sqrt{n}(g(\\hat{\\beta}) - g(\\beta))\\).",
  opts: ["Compute \\(g'(\\beta) = \\beta^2\\) (the function itself, rather than its proper derivative); the delta method then gives \\(\\sqrt{n}(\\hat{\\beta}^2 - \\beta^2) \\xrightarrow{d} N(0, \\beta^4 V)\\), using the formula \\([g'(\\beta)]^2 V = \\beta^4 V\\) to form the asymptotic variance of the estimator.", "Since \\(g(\\beta) = \\beta^2\\) is nonlinear, the delta method is not valid and one should use the bootstrap to obtain the asymptotic distribution; the delta method applies only to linear or affine transformations of \\(\\hat{\\beta}\\) where linearity ensures the normal limit is preserved exactly.", "Compute \\(g'(\\beta) = 2\\beta\\); since \\(g'(\\beta) \\ne 0\\) for \\(\\beta \\ne 0\\), the delta method applies; scale by \\(\\sqrt{n}\\), note \\(g'(\\tilde{\\beta}) \\xrightarrow{p} 2\\beta\\) by CMT, and apply Slutsky to conclude \\(\\sqrt{n}(\\hat{\\beta}^2-\\beta^2) \\xrightarrow{d} N(0, 4\\beta^2 V)\\).", "Apply the CMT: since \\(g(x) = x^2\\) is continuous and \\(\\sqrt{n}(\\hat{\\beta}-\\beta) \\xrightarrow{d} N(0,V)\\), the CMT gives \\(\\sqrt{n}(\\hat{\\beta}^2 - \\beta^2) \\xrightarrow{d} N(0,V)\\) by passing the limit through \\(g\\)."],
  correct: 2,
  explain: "The correct derivation uses \\(g'(\\beta) = 2\\beta\\) in the delta method. <b>Flaw 1:</b> \\(g'(\\beta) = 2\\beta\\), not \\(\\beta^2\\); confusing the function with its derivative gives the wrong avar \\(\\beta^4 V\\) instead of \\(4\\beta^2 V\\). <b>Flaw 2:</b> the delta method applies whenever \\(g\\) is continuously differentiable and \\(g'(\\beta) \\ne 0\\); \\(2\\beta \\ne 0\\) for \\(\\beta \\ne 0\\), so the delta method is valid; it is not limited to linear transformations. <b>Flaw 3:</b> the CMT preserves convergence in probability, not convergence in distribution, for a general continuous function; applied to a distributional limit, CMT requires the function to be linear (or the argument to be in probability); passing a \\(\\xrightarrow{d}\\) limit through \\(g(x) = x^2\\) does not give \\(N(0,V)\\). <span class=\"ref\">Guide §3.2</span>"
},
{ type: "metrics", topic: "WOLS consistency",
  q: "Derive the consistency condition for \\(\\hat{\\beta}_{WOLS}\\) and state which theorem licenses each step of the plim derivation.",
  opts: ["Substitute the model into the estimator to get \\(\\hat{\\beta} = \\beta + (\\frac{1}{n}\\sum w_i X_i X_i')^{-1}\\frac{1}{n}\\sum w_i X_i e_i\\); apply LLN to each average, CMT for the matrix inverse; consistency requires \\(E[w_i X_i e_i] = 0\\), satisfied under \\(E[e_i|X_i]=0\\) by the LIE.", "Substitute the model; apply LLN to \\(\\frac{1}{n}\\sum X_i X_i'\\) and \\(\\frac{1}{n}\\sum X_i e_i\\) separately; use CMT for the matrix inverse; consistency requires the unweighted condition \\(E[X_i e_i] = 0\\) since the weights \\(w_i\\) are claimed to cancel out entirely in the probability limit derivation.", "Substitute the model; take plims throughout; invoke Slutsky's theorem to pass the limit through the matrix inverse \\((\\frac{1}{n}\\sum w_i X_i X_i')^{-1}\\); conclude that consistency requires \\(E[w_i X_i e_i] = 0\\), but incorrectly attribute the inversion step to Slutsky rather than to CMT.", "Write \\(\\hat{\\beta} - \\beta = (\\sum w_i X_i X_i')^{-1}\\sum w_i X_i e_i\\); by LLN and CMT applied to the scaled sums, the probability limit equals \\(A^{-1} E[w_i^2 X_i e_i]\\); consistency therefore requires \\(E[w_i^2 X_i e_i] = 0\\), which does not follow from standard moment conditions."],
  correct: 0,
  explain: "The plim of WOLS requires LLN on the weighted averages and CMT for the inverse, giving consistency condition \\(E[w_i X_i e_i]=0\\). <b>Flaw 1:</b> the FOC of WOLS is \\(\\sum w_i X_i (Y_i - X_i'\\hat{\\beta}) = 0\\); the relevant orthogonality condition is the <i>weighted</i> moment \\(E[w_i X_i e_i]=0\\), not the unweighted \\(E[X_i e_i]=0\\); the weights do not cancel. <b>Flaw 2:</b> Slutsky's theorem combines a distributional limit with a probability limit; taking the plim through a matrix inverse is an application of the CMT (matrix inversion is a continuous function at an invertible matrix), not Slutsky. <b>Flaw 3:</b> when the model is substituted, the numerator is \\(\\frac{1}{n}\\sum w_i X_i e_i\\) (weight appears once from the FOC); squaring the weight to get \\(E[w_i^2 X_i e_i]\\) is an algebra error. <span class=\"ref\">Guide §3.1</span>"
},
{ type: "metrics", topic: "OVB hint route",
  q: "Short regression of \\(Y\\) on \\(S\\) alone; true long model \\(Y = \\omega_0 + \\omega_1 S + \\omega_2 A + e\\) with \\(E[e|S,A]=0\\). The exam hint reads: start from \\(\\hat{\\gamma}_1 = \\widehat{\\text{Cov}}(S,Y)/\\widehat{\\text{Var}}(S)\\). Derive \\(\\text{plim}\\,\\hat{\\gamma}_1\\).",
  opts: ["Run the auxiliary regression of \\(A\\) on \\(S\\) to get \\(\\hat{\\delta}_{AS}\\); the OVB formula gives \\(\\text{plim}\\,\\hat{\\gamma}_1 = \\omega_1 + \\omega_2 \\hat{\\delta}_{AS}\\); the hint derivation via \\(\\widehat{\\text{Cov}}(S,Y)/\\widehat{\\text{Var}}(S)\\) is unnecessary since the auxiliary-regression OVB formula gives the same correct answer without explicitly expanding the covariance.", "Start from \\(\\hat{\\gamma}_1 = \\widehat{\\text{Cov}}(S,Y)/\\widehat{\\text{Var}}(S)\\); substitute the long model to get \\(\\text{Cov}(S,Y) = \\omega_1 \\text{Var}(S) + \\omega_2 \\text{Cov}(S,A)\\) (the \\(\\text{Cov}(S,e)\\) term vanishes by LIE); apply LLN and CMT to conclude \\(\\text{plim}\\,\\hat{\\gamma}_1 = \\omega_1 + \\omega_2 \\frac{\\text{Cov}(S,A)}{\\text{Var}(S)}\\).", "Substitute the long model into \\(\\hat{\\gamma}_1 = \\widehat{\\text{Cov}}(S,Y)/\\widehat{\\text{Var}}(S)\\) and expand: \\(\\text{Cov}(S,Y) = \\omega_1 \\text{Var}(S) + \\omega_2 \\text{Var}(A)\\); applying LLN and CMT gives \\(\\text{plim}\\,\\hat{\\gamma}_1 = \\omega_1 + \\omega_2 \\frac{\\text{Var}(A)}{\\text{Var}(S)}\\).", "Apply the Frisch-Waugh-Lovell theorem to the short regression: the coefficient on \\(S\\) in the short regression equals the OLS of \\(M_{\\mathbf{1}}Y\\) on \\(M_{\\mathbf{1}}S\\) (residualizing on the constant); subtract the FWL coefficient in the long regression to recover the bias \\(\\omega_2 \\text{Cov}(S,A)/\\text{Var}(S)\\)."],
  correct: 1,
  explain: "The exam specifies starting from the Cov/Var ratio and substituting the long model; the covariance is linear in the model parameters. <b>Flaw 1:</b> while the auxiliary-regression OVB formula gives the correct final answer, using it without the derivation via \\(\\widehat{\\text{Cov}}(S,Y)/\\widehat{\\text{Var}}(S)\\) skips the algebraic step the exam rewards; the hint is instructional, not optional. <b>Flaw 2:</b> expanding \\(\\text{Cov}(S,Y)\\) using the long model yields \\(\\omega_1\\text{Var}(S) + \\omega_2 \\text{Cov}(S,A)\\), not \\(\\omega_1\\text{Var}(S) + \\omega_2 \\text{Var}(A)\\); the bias term involves \\(\\text{Cov}(S,A)\\), not \\(\\text{Var}(A)\\). <b>Flaw 3:</b> FWL identifies the coefficient in the <i>long</i> regression, not the short one; it does not directly produce the OVB formula. <span class=\"ref\">Guide §3.4</span>"
},
{ type: "metrics", topic: "2SLS overidentified",
  q: "You have \\(L=3\\) instruments \\(Z\\) and \\(K=1\\) endogenous regressor \\(X\\), with \\(E[Z_i e_i]=0\\) and \\(E[Z_i X_i]\\) full rank. Propose and justify a consistent estimator.",
  opts: ["Write \\(\\hat{\\beta}_{IV} = (Z'X)^{-1}Z'Y\\); substitute the model to get \\(\\hat{\\beta}_{IV} = \\beta + (Z'X)^{-1}Z'e\\); apply LLN to \\(\\frac{1}{n}Z'X\\) and \\(\\frac{1}{n}Z'e\\) separately, and CMT for the inverse; exogeneity ensures \\(E[Z_i e_i]=0\\) so \\(\\hat{\\beta}_{IV} \\xrightarrow{p} \\beta\\) by the CMT.", "Run OLS of \\(X\\) on \\(Z\\) to get \\(\\hat{X} = P_Z X\\); run OLS of \\(Y\\) on \\(\\hat{X}\\); use the stage-2 residuals \\(\\hat{e}_2 = Y - \\hat{X}\\hat{\\beta}\\) to compute the variance estimate; these literal two-step standard errors are numerically correct because stage-2 residuals converge to true residuals.", "Use 2SLS: \\(\\hat{\\beta}_{2SLS} = (X'P_Z X)^{-1}X'P_Z Y\\) where \\(P_Z = Z(Z'Z)^{-1}Z'\\); write \\(\\hat{\\beta}_{2SLS} = \\beta + (\\frac{1}{n}X'P_Z X)^{-1}\\frac{1}{n}X'P_Z e\\); since \\(E[Z_i e_i]=0\\) implies \\(E[P_Z x_i \\cdot e_i]=0\\), LLN and CMT establish consistency; use the 2SLS sandwich formula for standard errors, not stage-2 OLS residuals.", "Pick the single instrument most correlated with \\(X\\) and use just-identified IV: \\(\\hat{\\beta} = \\frac{\\sum z_{1i}Y_i}{\\sum z_{1i}X_i}\\); this is consistent under relevance and exogeneity of \\(z_1\\) and avoids the matrix algebra of 2SLS entirely; the two additional instruments can be reserved to conduct a formal test of overidentifying restrictions later."],
  correct: 2,
  explain: "With \\(L \\gt K\\), the matrix \\(Z'X\\) is \\(L \\times K\\) non-square and its inverse does not exist; 2SLS via the projection \\(P_Z\\) is the correct procedure. <b>Flaw 1:</b> writing \\((Z'X)^{-1}\\) is an automatic deduction when \\(L \\gt K\\); the \\(3 \\times 1\\) matrix \\(Z'X\\) has no inverse. <b>Flaw 2:</b> the literal two-step SEs use \\(\\hat{e}_2 = Y - \\hat{X}\\hat{\\beta}\\) instead of \\(Y - X\\hat{\\beta}\\); these understate the true residual variance because \\(\\hat{X}\\) is smoother than \\(X\\); the correct variance formula uses the 2SLS sandwich. <b>Flaw 3:</b> using only one instrument discards the efficiency gain from the other two and prevents a test of overidentifying restrictions; moreover choosing the strongest instrument in-sample introduces selection bias. <span class=\"ref\">Guide §3.5</span>"
},
{ type: "metrics", topic: "LATE type cancellation",
  q: "Binary instrument \\(Z\\), binary treatment \\(D\\), imperfect compliance. Show that the Wald estimand \\((E[Y|Z=1]-E[Y|Z=0])/(E[D|Z=1]-E[D|Z=0])\\) equals \\(E[Y(1)-Y(0)\\,|\\,\\text{complier}]\\).",
  opts: ["Expand \\(E[Y|Z=1]-E[Y|Z=0]\\) by summing over the four compliance types; always-takers cancel under both arms; never-takers also cancel; defiers have probability zero by monotonicity; only compliers remain, giving \\(P(C)\\cdot E[Y(1)-Y(0)|C]\\); dividing by the denominator \\(P(C)\\) yields LATE.", "Note that \\(E[Y|Z=1]-E[Y|Z=0]\\) equals the naive comparison \\(E[Y|D=1]-E[Y|D=0]\\) under random assignment; subtract selection bias to recover LATE for compliers under the given assumptions.", "Write the numerator as \\(ITT_Y = E[Y|Z=1]-E[Y|Z=0]\\) and the denominator as \\(ITT_D = E[D|Z=1]-E[D|Z=0]\\); since \\(Z\\) is randomly assigned, the ratio \\(ITT_Y/ITT_D\\) identifies LATE; no further algebra is needed to show why only compliers appear.", "Assume homogeneous effects \\(Y_i(1)-Y_i(0) = \\tau\\) for all \\(i\\); then \\(E[Y|Z=1]-E[Y|Z=0] = \\tau \\cdot P(C)\\) and the denominator is \\(P(C)\\), so the Wald estimand equals \\(\\tau = \\text{LATE} = \\text{ATE}\\); this shows Wald identifies LATE under the general conditions."],
  correct: 0,
  explain: "The proof requires expanding the ITT by compliance type and showing cancellation. <b>Flaw 1:</b> \\(E[Y|Z=1]-E[Y|Z=0]\\) is the ITT, not the naive comparison \\(E[Y|D=1]-E[Y|D=0]\\); the naive comparison conditions on \\(D\\), which is endogenous; equating the two is wrong. <b>Flaw 2:</b> labeling the ratio \\(ITT_Y/ITT_D\\) and asserting it is LATE skips the key algebra — the type-expansion showing why always-takers and never-takers cancel; this derivation is exactly what earns points. <b>Flaw 3:</b> invoking homogeneous effects proves that LATE equals ATE under that special case but does not prove the Wald formula equals LATE in general; the derivation must not assume homogeneity. <span class=\"ref\">Guide §3.3</span>"
},
{ type: "metrics", topic: "One-sided noncompliance",
  q: "Instrument \\(Z\\) is randomly assigned; assume \\(D_i(0)=0\\) for all \\(i\\) (no one takes treatment without encouragement). What does the Wald estimator identify?",
  opts: ["With \\(D_i(0)=0\\) for all units, the population still includes always-takers (\\(D(0)=D(1)=1\\)), never-takers, and compliers; the Wald estimator identifies a weighted average of effects across always-takers and compliers, which equals ATE under monotonicity.", "\\(D_i(0)=0\\) rules out always-takers, leaving only compliers (\\(D(0)=0,D(1)=1\\)) and never-takers; only compliers switch treatment with \\(Z\\), so \\(E[D|Z=1]-E[D|Z=0]=P(C) \\gt 0\\) and Wald identifies LATE\\(=\\)ATT.", "With one-sided noncompliance the denominator \\(E[D|Z=1]-E[D|Z=0]=0\\) because untreated units never self-select into treatment; the Wald ratio is therefore undefined and identifies only the ITT divided by the compliance rate, which is not equal to LATE.", "Wald identifies the effect for never-takers: since \\(D_i(0)=0\\) for all units, instrument variation in \\(Z\\) reveals what they would have experienced under treatment."],
  correct: 1,
  explain: "Under one-sided noncompliance, always-takers are ruled out and Wald identifies LATE = ATT. <b>Flaw 1:</b> always-takers have \\(D_i(0)=1\\); the assumption \\(D_i(0)=0\\) for all units directly rules them out; claiming always-takers are present contradicts the given condition. <b>Flaw 2:</b> compliers still switch treatment status (\\(D_i(0)=0, D_i(1)=1\\)), so \\(E[D|Z=1]-E[D|Z=0] = P(C) \\gt 0\\) as long as there are any compliers; the denominator is not zero. <b>Flaw 3:</b> never-takers have \\(D_i(1)=0\\) as well as \\(D_i(0)=0\\), so their treatment status never responds to \\(Z\\); the instrument generates no variation in their treatment and their effects are unidentified. <span class=\"ref\">Guide §3.3</span>"
},
{ type: "metrics", topic: "Measurement error IV",
  q: "Classical errors-in-variables: \\(x^* = x + \\varepsilon\\), \\(E[\\varepsilon]=0\\), \\(\\text{Cov}(x,\\varepsilon)=\\text{Cov}(u,\\varepsilon)=0\\). A second measure \\(x^{**}=x+\\eta\\) is available with \\(\\eta\\) independent of \\(x,\\varepsilon,u\\). Assess validity of \\(x^{**}\\) as instrument for \\(x^*\\).",
  opts: ["Check relevance: \\(\\text{Cov}(x^{**},x^*)=\\text{Var}(x) \\gt 0\\) since \\(\\eta\\) and \\(\\varepsilon\\) are mutually independent of each other and therefore do not covary; check exogeneity: \\(\\text{Cov}(x^{**},u)=\\text{Cov}(x,u)+\\text{Cov}(\\eta,u)=0\\); both conditions hold so \\(x^{**}\\) is a valid instrument for \\(x^*\\) in the structural equation.", "\\(x^{**}\\) is not a valid instrument because both \\(x^*\\) and \\(x^{**}\\) measure the same underlying true \\(x\\) with classical measurement error; the two measurement errors \\(\\varepsilon\\) and \\(\\eta\\) are correlated through their common latent source \\(x\\), which directly violates the required exogeneity condition for a valid instrument.", "Check three conditions: (i) relevance \\(\\text{Cov}(x^{**},x^*)=\\text{Var}(x) \\gt 0\\); (ii) \\(\\text{Cov}(x^{**},u)=0\\) since \\(\\eta \\perp u\\); (iii) \\(\\text{Cov}(x^{**},\\varepsilon)=\\text{Cov}(x,\\varepsilon)+\\text{Cov}(\\eta,\\varepsilon)=0\\) since \\(\\eta \\perp \\varepsilon\\) by independence; all three hold, so \\(x^{**}\\) is a valid IV.", "\\(x^{**}\\) is valid; perform the first stage by regressing \\(x^{**}\\) on \\(x^*\\) to obtain \\(\\hat{x}^{**}\\) and then use it in the structural equation; relevance follows because \\(\\text{Cov}(x^{**},x^*) = \\text{Var}(x) + \\text{Cov}(\\varepsilon,\\eta) = \\text{Var}(x) \\gt 0\\)."],
  correct: 2,
  explain: "A valid instrument for \\(x^*\\) under classical MEV requires three conditions, with the third (\\(\\text{Cov}(z,\\varepsilon)=0\\)) being the one most often forgotten. <b>Flaw 1:</b> the feasible regression error is \\(v = u - \\beta_1 \\varepsilon\\); the instrument must also satisfy \\(\\text{Cov}(x^{**},\\varepsilon)=0\\); omitting this third condition misses the named deduction in the guide. <b>Flaw 2:</b> the setup explicitly states \\(\\eta\\) is independent of \\(\\varepsilon\\); independent random variables have zero covariance, so the claim that measurement errors are correlated is false. <b>Flaw 3:</b> in 2SLS the first stage regresses the endogenous regressor \\(x^*\\) on the instrument \\(x^{**}\\), not the reverse; the roles of instrument and endogenous variable are swapped here. <span class=\"ref\">Guide §4.1</span>"
},
{ type: "metrics", topic: "MLE Poisson",
  q: "\\(X_1,\\ldots,X_n\\) are iid Poisson\\((\\lambda)\\). Derive the MLE \\(\\hat{\\lambda}\\) and its asymptotic distribution.",
  opts: ["Write the log-likelihood \\(\\ell(\\lambda) = -n\\lambda + (\\sum_i x_i)\\log\\lambda - \\sum_i \\log x_i!\\); FOC gives \\(\\hat{\\lambda} = \\bar{X}\\); SOC confirms a maximum; consistency: LLN gives \\(\\bar{X} \\xrightarrow{p} \\lambda\\); Fisher information \\(I(\\lambda) = 1/\\lambda\\); asymptotic distribution \\(\\sqrt{n}(\\hat{\\lambda}-\\lambda) \\xrightarrow{d} N(0, \\lambda)\\).", "Derive \\(\\hat{\\lambda} = \\bar{X}\\) via the first-order condition; check SOC; for the avar, the MLE achieves the Cramer-Rao bound, so avar \\(= I(\\lambda)^2 = 1/\\lambda^2\\); conclude \\(\\sqrt{n}(\\hat{\\lambda}-\\lambda) \\xrightarrow{d} N(0, 1/\\lambda^2)\\).", "Write the log-likelihood, take the FOC to get \\(\\hat{\\lambda} = \\bar{X}\\); confirm the SOC; establish consistency by applying the CLT to \\(\\bar{X}\\): since \\(\\sqrt{n}(\\bar{X}-\\lambda) \\xrightarrow{d} N(0,\\lambda)\\), we have \\(\\bar{X} \\xrightarrow{p} \\lambda\\).", "Derive \\(\\hat{\\lambda}=\\bar{X}\\) from the FOC; use the outer-product-of-gradients (OPG) estimator \\(\\hat{I}_{OPG} = \\frac{1}{n}\\sum_i (\\partial \\ell_i/\\partial \\lambda)^2\\) as the information matrix; conclude avar \\(= \\hat{I}_{OPG}^{-1}\\); skip the SOC since the OPG positivity confirms a maximum."],
  correct: 0,
  explain: "The six-step MLE ritual is: likelihood, log, FOC, SOC, consistency (LLN+CMT), avar (Fisher inverse). <b>Flaw 1:</b> the asymptotic variance of the MLE is \\(I(\\lambda)^{-1}\\), the <i>inverse</i> of Fisher information; for Poisson \\(I(\\lambda)^{-1} = \\lambda\\), not \\(I(\\lambda)^2 = 1/\\lambda^2\\). <b>Flaw 2:</b> the CLT delivers a distributional limit, not a probability limit; invoking CLT to establish \\(\\bar{X} \\xrightarrow{p} \\lambda\\) is the wrong theorem; consistency uses the LLN. <b>Flaw 3:</b> the OPG and the Hessian-based information matrix are equal at the true parameter for correctly specified models, but the OPG does not substitute for the SOC check; confirming the FOC is a maximum requires verifying the second derivative is negative. <span class=\"ref\">Guide §4.2</span>"
},
{ type: "metrics", topic: "MLE invariance",
  q: "\\(\\hat{\\lambda}\\) is the Poisson MLE. Propose an estimator of \\(g(\\lambda)=1/\\lambda\\) and derive its asymptotic distribution.",
  opts: ["\\(1/\\hat{\\lambda}\\) is consistent by the continuous mapping theorem but is not the MLE of \\(1/\\lambda\\) since the MLE of a ratio is not the ratio of individual MLEs in general; compute the MLE of \\(1/\\lambda\\) separately by reparametrizing \\(\\mu = 1/\\lambda\\) and directly maximizing the reparametrized Poisson likelihood in \\(\\mu\\) to find the true MLE.", "By MLE invariance, \\(1/\\hat{\\lambda}\\) is the MLE of \\(1/\\lambda\\); apply the delta method with \\(g'(\\lambda) = -1/\\lambda^2\\); since \\(I(\\lambda)^{-1}=\\lambda\\) for Poisson, avar \\(= [g'(\\lambda)]^2 \\cdot I(\\lambda)^{-1} = (1/\\lambda^4)\\cdot\\lambda = 1/\\lambda^3\\); so \\(\\sqrt{n}(1/\\hat{\\lambda}-1/\\lambda) \\xrightarrow{d} N(0, 1/\\lambda^3)\\).", "By invariance, \\(1/\\hat{\\lambda}\\) is the MLE; delta method: avar \\(= [g'(\\lambda)]^2 \\cdot I(\\lambda) = (1/\\lambda^4)\\cdot(1/\\lambda) = 1/\\lambda^5\\); conclude \\(\\sqrt{n}(1/\\hat{\\lambda}-1/\\lambda) \\xrightarrow{d} N(0,1/\\lambda^5)\\).", "Propose \\(\\hat{\\mu} = \\frac{1}{n}\\sum_i 1/X_i\\) as an estimator of \\(1/\\lambda\\); apply the CLT to \\(\\{1/X_i\\}\\) directly to get its asymptotic distribution; this is consistent since \\(E[1/X_i]=1/\\lambda\\) and avoids the delta method."],
  correct: 1,
  explain: "MLE invariance says \\(g(\\hat{\\theta})\\) is the MLE of \\(g(\\theta)\\); the delta method then gives the avar. <b>Flaw 1:</b> MLE invariance states exactly that \\(1/\\hat{\\lambda}\\) is the MLE of \\(1/\\lambda\\); reparametrizing and re-maximizing produces the same answer by this theorem; denying invariance contradicts a standard MLE property. <b>Flaw 2:</b> the delta method formula is \\([g'(\\lambda)]^2 \\cdot I(\\lambda)^{-1}\\) (the avar of \\(\\hat{\\lambda}\\) is \\(I(\\lambda)^{-1}\\)); using \\(I(\\lambda)\\) instead of \\(I(\\lambda)^{-1}\\) gives the wrong avar. <b>Flaw 3:</b> for a Poisson random variable \\(X_i\\), \\(P(X_i=0) = e^{-\\lambda} \\gt 0\\), so \\(1/X_i\\) is undefined with positive probability and the sample mean \\(\\frac{1}{n}\\sum 1/X_i\\) diverges; this estimator does not exist. <span class=\"ref\">Guide §4.2</span>"
},
{ type: "metrics", topic: "Sandwich variance",
  q: "Under heteroskedasticity of unknown form, propose an asymptotically valid variance estimator for \\(\\hat{\\beta}_{OLS}\\) and justify its consistency.",
  opts: ["Use \\(\\hat{V} = \\hat{\\sigma}^2(\\frac{1}{n}X'X)^{-1}\\) where \\(\\hat{\\sigma}^2 = \\frac{1}{n-K}\\sum_i \\hat{e}_i^2\\); this estimator is consistent for \\(A^{-1}BA^{-1}\\) by LLN and CMT and is claimed to remain valid under heteroskedasticity of unknown form because \\(\\hat{\\sigma}^2\\) converges to \\(E[e_i^2]\\) by the LLN in large samples.", "Form \\(\\hat{V} = \\frac{1}{n}\\sum_i X_i X_i' \\hat{e}_i^2\\) (the \\(\\hat{B}\\) matrix alone) as an estimator of \\(B = E[X_i X_i' e_i^2]\\); this is consistent by LLN applied to the squared-residual outer products; since \\(\\hat{B}\\) captures the pattern of heteroskedasticity it serves as the asymptotically valid variance estimate for the OLS estimator.", "Use the White sandwich \\(\\hat{V} = \\hat{A}^{-1}\\hat{B}\\hat{A}^{-1}\\) with \\(\\hat{A}=\\frac{1}{n}\\sum X_i X_i'\\) and \\(\\hat{B}=\\frac{1}{n}\\sum X_i X_i'\\hat{e}_i^2\\); by LLN, \\(\\hat{A} \\xrightarrow{p} A\\) and \\(\\hat{B} \\xrightarrow{p} B\\); CMT gives \\(\\hat{V} \\xrightarrow{p} A^{-1}BA^{-1}\\); no homoskedasticity assumption is needed.", "Report the homoskedastic OLS standard errors and note they are conservative under heteroskedasticity: \\(E[\\hat{\\sigma}^2(X'X)^{-1}] \\ge A^{-1}BA^{-1}\\) entry-wise, so inference is valid with a higher probability than the nominal level."],
  correct: 2,
  explain: "The White sandwich estimator is the correct tool for heteroskedasticity-robust inference. <b>Flaw 1:</b> \\(\\hat{\\sigma}^2(X'X/n)^{-1}\\) is the homoskedastic formula; it is consistent for \\(A^{-1}BA^{-1}\\) only when \\(B = \\sigma^2 A\\) (i.e., \\(E[e_i^2|X_i]=\\sigma^2\\)); under general heteroskedasticity this formula is inconsistent. <b>Flaw 2:</b> the correct asymptotic variance is \\(A^{-1}BA^{-1}\\), not \\(B\\) alone; \\(\\hat{B}\\) without the \\(\\hat{A}^{-1}\\) bookends is not a consistent estimator of the avar. <b>Flaw 3:</b> homoskedastic SEs are not in general conservative under heteroskedasticity; they can be either too large or too small depending on how \\(X_i^2\\) and \\(e_i^2\\) covary; there is no entry-wise inequality \\(\\hat{\\sigma}^2(X'X)^{-1} \\ge A^{-1}BA^{-1}\\) in general. <span class=\"ref\">Guide §4.3</span>"
},
{ type: "metrics", topic: "Wald variance of difference",
  q: "You test \\(H_0: \\beta_1 = \\beta_2\\). Derive the variance of \\(\\hat{\\beta}_1 - \\hat{\\beta}_2\\) and state the correct test statistic.",
  opts: ["\\(\\text{Var}(\\hat{\\beta}_1 - \\hat{\\beta}_2) = V_{11} + V_{22} - 2V_{12}\\); estimate with \\(\\hat{V}_{11}+\\hat{V}_{22}-2\\hat{V}_{12}\\) from the sandwich; form Wald statistic \\((\\hat{\\beta}_1-\\hat{\\beta}_2)^2/(\\hat{V}_{11}+\\hat{V}_{22}-2\\hat{V}_{12}) \\xrightarrow{d} \\chi^2(1)\\) under \\(H_0\\).", "Since \\(\\hat{\\beta}_1\\) and \\(\\hat{\\beta}_2\\) are two separate OLS coefficients, \\(\\text{Var}(\\hat{\\beta}_1 - \\hat{\\beta}_2) = V_{11} + V_{22}\\); form the t-statistic \\((\\hat{\\beta}_1-\\hat{\\beta}_2)/\\sqrt{\\hat{V}_{11}+\\hat{V}_{22}}\\), which is asymptotically standard normal under \\(H_0\\).", "Use the F-test: estimate the restricted model with \\(\\beta_1 = \\beta_2\\) imposed and compute \\(F = (RSS_R - RSS_U)/(s^2)\\); under \\(H_0\\) and normality \\(F \\sim F(1, n-K)\\); this is exact in finite samples and asymptotically \\(\\chi^2(1)\\).", "Test \\(H_0: \\beta_1 = 0\\) and \\(H_0: \\beta_2 = 0\\) separately at level \\(\\alpha/2\\) each using a Bonferroni procedure; if neither is rejected, conclude \\(\\beta_1 = \\beta_2 = 0\\) and hence \\(\\beta_1 = \\beta_2\\)."],
  correct: 0,
  explain: "The variance of a difference includes the covariance term \\(-2V_{12}\\), which is a named deduction. <b>Flaw 1:</b> OLS coefficients within the same regression are generally correlated; \\(\\text{Var}(\\hat{\\beta}_1-\\hat{\\beta}_2) = V_{11}+V_{22}-2V_{12}\\); omitting \\(-2V_{12}\\) yields a biased variance estimate and an invalid test. <b>Flaw 2:</b> the F-test with \\(s^2\\) in the denominator requires homoskedasticity for exact finite-sample validity; under heteroskedasticity the Wald \\(\\chi^2\\) test with the sandwich variance is correct. <b>Flaw 3:</b> testing \\(\\beta_1=0\\) and \\(\\beta_2=0\\) separately is not equivalent to testing \\(\\beta_1=\\beta_2\\); even if both are nonzero and equal, the separate tests may reject while the difference test does not. <span class=\"ref\">Guide §4.3</span>"
},
{ type: "metrics", topic: "One-sided Wald test",
  q: "You test \\(H_0: \\beta \\le 0.2\\) against \\(H_1: \\beta \\gt 0.2\\). State the correct critical value and test statistic.",
  opts: ["Form \\(W = n(\\hat{\\beta}-0.2)^2/\\hat{V}\\); under \\(H_0\\) at the boundary point, \\(W \\xrightarrow{d}\\chi^2(1)\\); reject at the 5% level when \\(W \\gt 3.84\\), which is the 95th percentile of the \\(\\chi^2(1)\\) distribution; this two-sided test does not respect the direction of the one-sided alternative.", "Form the t-statistic \\(t = (\\hat{\\beta}-0.2)/\\sqrt{\\hat{V}/n}\\); under \\(H_0\\) with equality, \\(t \\xrightarrow{d} N(0,1)\\); reject at the 5% level when \\(|t| \\gt 1.96\\) because the test is symmetric and does not account for the one-sided nature of the alternative hypothesis.", "Estimate the restricted model setting \\(\\beta=0.2\\) and compute \\(F=(\\hat{\\beta}-0.2)^2/\\hat{V}\\); since \\(F \\sim \\chi^2(1)/1\\) asymptotically under \\(H_0\\), reject at the 5% level when \\(F \\gt 3.84\\); the one-sided nature of the alternative is automatically captured by this approach.", "Form \\(t = (\\hat{\\beta}-0.2)/\\sqrt{\\hat{V}/n}\\); under \\(H_0\\) with equality \\(t \\xrightarrow{d} N(0,1)\\); for the one-sided alternative \\(H_1: \\beta \\gt 0.2\\), reject when \\(t \\gt 1.645\\); using the two-sided critical value 1.96 would be overly conservative."],
  correct: 3,
  explain: "A one-sided test against an upper-tail alternative uses the 1.645 critical value, not 1.96 or \\(\\chi^2\\) quantiles. <b>Flaw 1:</b> the chi-squared test \\(W \\gt 3.84\\) is a two-sided test in disguise (\\(\\chi^2(1) = Z^2\\)); it rejects when \\(|\\hat{\\beta}-0.2|\\) is large in either direction and is not appropriate for a one-sided alternative. <b>Flaw 2:</b> the two-sided critical value 1.96 is overly conservative for a one-sided test; the correct value is 1.645, which gives a more powerful test against the upper-tail alternative. <b>Flaw 3:</b> the F-statistic \\((\\hat{\\beta}-0.2)^2/\\hat{V}\\) squares the deviation and therefore cannot detect directionality; a one-sided test requires an unsigned statistic only for two-sided tests; using the F-form here applies the wrong critical value and cannot distinguish \\(\\beta \\gt 0.2\\) from \\(\\beta \\lt 0.2\\). <span class=\"ref\">Guide §4.3</span>"
},
{ type: "metrics", topic: "Bonferroni correction",
  q: "An event study tests \\(H_0: \\delta_\\ell = 0\\) for \\(\\ell = -3,-2,-1\\) (three pre-period leads) each at the 5% level. What is the uncorrected FWER and how do you control it?",
  opts: ["Under independence, the FWER equals \\(m \\times \\alpha = 3 \\times 0.05 = 0.15\\); apply Bonferroni by testing each hypothesis at \\(0.15/3 = 0.05\\); no further correction is needed since the individual and Bonferroni threshold levels coincide at the chosen significance level.", "FWER \\(= 1-(1-0.05)^3 \\approx 14.3\\%\\) under independence; apply Bonferroni: test each \\(\\delta_\\ell = 0\\) at \\(\\alpha/m = 0.05/3 \\approx 0.017\\); this controls FWER \\(\\le 0.05\\) by the union bound without requiring independence, at the cost of some power.", "FWER \\(= 1-(0.95)^3 \\approx 14.3\\%\\); apply the Bonferroni correction by testing each hypothesis at \\(\\alpha/m^2 = 0.05/9 \\approx 0.0056\\); the squared denominator accounts for pairwise dependencies among the three tests.", "Since the null hypothesis of parallel pre-trends implies all three \\(\\delta_\\ell\\) are jointly zero, and testing jointly via a single chi-squared Wald test already controls overall size at 5%, no additional Bonferroni correction is needed for the individual pre-period tests."],
  correct: 1,
  explain: "FWER under independence is \\(1-(1-\\alpha)^m\\); Bonferroni tests each at \\(\\alpha/m\\) using the union bound. <b>Flaw 1:</b> \\(m \\times \\alpha\\) is the Bonferroni union-bound upper limit on FWER, not the exact FWER under independence; the exact FWER is \\(1-(1-\\alpha)^m\\); moreover the conclusion that \\(\\alpha/m = \\alpha\\) misapplies the correction. <b>Flaw 2:</b> Bonferroni requires testing at \\(\\alpha/m\\), not \\(\\alpha/m^2\\); the \\(m^2\\) denominator has no theoretical basis and is unnecessarily conservative. <b>Flaw 3:</b> the joint Wald test controls size for the joint null; the Bonferroni issue arises when running separate tests; if the question involves reporting individual test results, each at 5%, the FWER is inflated and correction is needed. <span class=\"ref\">Guide §4.3</span>"
},
{ type: "metrics", topic: "FE vs FD T=2",
  q: "Panel with \\(N\\) large, \\(T=2\\), possible serial correlation in \\(u_{it}\\). Compare the within (FE) and first-difference (FD) estimators.",
  opts: ["FE is preferred because it uses all \\(T(T-1)/2\\) pairs of time periods for each unit, providing more efficient estimates than FD; FD relies only on consecutive differences and necessarily discards information available from non-consecutive period comparisons within each unit in the panel.", "FD is preferred under serial correlation because differencing transforms \\(u_{it}\\) into \\(\\Delta u_{it}\\), which eliminates the within-unit autocorrelation; OLS on the differenced equation is then fully efficient without further correction.", "With \\(T=2\\), FE and FD produce numerically identical point estimates; under serial correlation, both require cluster-robust standard errors clustered at the unit level to account for arbitrary within-unit error correlation; neither estimator by itself corrects for serial correlation.", "Use random-effects GLS, which accounts for within-unit error correlation through its variance-components structure; under serial correlation RE is more efficient than FE or FD and avoids the need for cluster-robust standard errors."],
  correct: 2,
  explain: "For \\(T=2\\), FE and FD are identical; serial correlation demands cluster-robust SEs. <b>Flaw 1:</b> with \\(T=2\\) there is exactly one pair per unit; \\(T(T-1)/2 = 1\\); FE and FD are numerically identical; the claim that FE uses more pairs is false for \\(T=2\\). <b>Flaw 2:</b> differencing removes the unit fixed effect \\(c_i\\) but not serial correlation in \\(u_{it}\\); if \\(u_{it}\\) follows AR(1), \\(\\Delta u_{it}\\) is MA(1) with negative autocorrelation; cluster-robust SEs are still needed. <b>Flaw 3:</b> RE requires \\(E[c_i|X_i]=0\\); when unit effects are correlated with regressors (typical motivation for FE/FD) RE is inconsistent; inconsistency is not corrected by a more sophisticated variance structure. <span class=\"ref\">Guide §4.5</span>"
},
{ type: "metrics", topic: "Two-way FE omitted time effects",
  q: "True model: \\(y_{it} = x_{it}'\\beta + c_i + \\lambda_t + u_{it}\\). You run one-way within (FE), demeaning only by unit means. Derive the inconsistency.",
  opts: ["The within transform subtracts \\(\\bar{y}_i\\) from \\(y_{it}\\); the demeaned error is \\((\\lambda_t - \\bar{\\lambda}_i) + \\ddot{u}_{it}\\); if \\(x_{it}\\) co-moves with time shocks, the plim of \\(\\hat{\\beta}_{FE}\\) includes a nonzero omitted-variable bias term; the correct fix is two-way FE, adding time dummies to the regression.", "One-way demeaning subtracts the unit mean \\(\\bar{y}_i\\) but \\(\\bar{c}_i = c_i\\) (since \\(c_i\\) is time-invariant its unit mean equals itself), so the within transform does not remove \\(c_i\\) entirely; the residual \\(c_i - c_i = 0\\) only holds if \\(c_i\\) is exactly constant, which may not hold if \\(c_i\\) drifts.", "Run random-effects GLS, which models the composite error \\(c_i + \\lambda_t + u_{it}\\); with \\(E[c_i|X_i]=0\\) the RE estimator is consistent and the time effects \\(\\lambda_t\\) are fully absorbed into the variance components structure without time dummies.", "Apply first-differencing; the FD transform subtracts \\(y_{i,t-1}\\) from \\(y_{it}\\); since \\(c_i\\) cancels and \\(\\lambda_t - \\lambda_{t-1}\\) is a common time increment, including a period dummy in the FD regression absorbs the time effect; no two-way FE is needed."],
  correct: 0,
  explain: "The inconsistency of one-way FE comes from the omitted time effects surviving the within transform. <b>Flaw 1:</b> the within transform subtracts the unit-specific time mean \\(\\bar{c}_i = c_i\\) for a time-invariant effect; \\(c_i - c_i = 0\\) exactly, so \\(c_i\\) is fully removed; the remaining bias comes from \\(\\lambda_t\\), not from a failure to remove \\(c_i\\). <b>Flaw 2:</b> RE does not absorb period-specific time effects \\(\\lambda_t\\); RE models a unit-specific random intercept; the time effects \\(\\lambda_t\\) are still omitted unless time dummies are included. <b>Flaw 3:</b> FD does remove \\(c_i\\), but the differenced time effect is \\(\\lambda_t - \\lambda_{t-1}\\), not zero; this varies across periods and if \\(\\Delta x_{it}\\) correlates with \\(\\Delta\\lambda_t\\), the FD estimator is also inconsistent; adding period dummies to the FD regression is the correct fix. <span class=\"ref\">Guide §4.5</span>"
},
{ type: "metrics", topic: "Arellano-Bond GMM",
  q: "Panel: \\(y_{it} = w_{it}'\\beta + c_i + u_{it}\\), \\(T=4\\), \\(w_{it}\\) predetermined (\\(E[w_{is}u_{it}]=0\\) for \\(s \\le t\\)). Propose a consistent estimator.",
  opts: ["Apply the within transform and run pooled OLS (FE); demeaning removes \\(c_i\\), and the moment condition \\(E[w_{is}u_{it}]=0\\) for \\(s \\le t\\) is sufficient for the within estimator to be consistent since the demeaned regressor incorporates only contemporaneous and strictly lagged values of \\(w_{it}\\) in its final constructed form.", "First-difference to remove \\(c_i\\); at each \\(t\\), instrument \\(\\Delta w_{it}\\) with levels \\(w_{i,t-2}, w_{i,t-3}, \\ldots, w_{i1}\\); stack into a block-diagonal \\(Z_i\\) with one block per FD equation; estimate via GMM using the efficient weight matrix; this exploits all valid moment conditions from predetermined \\(w_{it}\\).", "First-difference to remove \\(c_i\\); instrument \\(\\Delta w_{it}\\) with \\(\\Delta w_{i,t-1}\\) (the once-lagged first difference); this instrument is predetermined relative to \\(\\Delta u_{it}\\) since \\(\\Delta w_{i,t-1}\\) depends only on \\(w_{i,t-1}\\) and \\(w_{i,t-2}\\), both dated before period \\(t\\).", "Run random-effects GLS; if \\(w_{it}\\) is truly only predetermined, apply the Hausman test to check whether FE or RE is consistent; if Hausman does not reject, the RE estimator is efficient and consistent without requiring instruments."],
  correct: 1,
  explain: "Predetermined regressors violate strict exogeneity and require the Arellano-Bond GMM strategy. <b>Flaw 1:</b> FE requires strict exogeneity \\(E[w_{is}u_{it}]=0\\) for <i>all</i> \\(s,t\\); demeaning mixes future regressors \\(w_{i,s}\\) with \\(s \\gt t\\) into the demeaned error; predetermined only guarantees the condition for \\(s \\le t\\), not \\(s \\gt t\\), so FE is inconsistent. <b>Flaw 2:</b> \\(\\Delta w_{i,t-1} = w_{i,t-1} - w_{i,t-2}\\); the term \\(w_{i,t-1}\\) is contemporaneous with \\(u_{i,t-1}\\), which appears in \\(\\Delta u_{it} = u_{it} - u_{i,t-1}\\); since predetermined means \\(E[w_{i,t-1}u_{i,t-1}] \\ne 0\\) in general, \\(\\Delta w_{i,t-1}\\) is correlated with \\(\\Delta u_{it}\\) and is not a valid instrument. <b>Flaw 3:</b> with predetermined regressors, unit effects \\(c_i\\) are very likely correlated with \\(w_{it}\\); RE requires \\(E[c_i|w_i]=0\\), which fails here; the Hausman pretest cannot rescue a fundamentally inconsistent estimator. <span class=\"ref\">Guide §5 (Arellano-Bond)</span>"
},
{ type: "metrics", topic: "Control function for nonlinear endogenous",
  q: "Model: \\(y_1 = \\alpha + \\beta_1 y_2 + \\beta_2 y_2^2 + \\gamma z_1 + u\\); \\(y_2\\) is endogenous; instrument \\(z_2\\) is available. Propose a consistent estimation strategy.",
  opts: ["Use 2SLS: instrument \\(y_2\\) with \\(z_2\\) and instrument \\(y_2^2\\) with \\(z_2^2\\); run the two-stage procedure with instruments \\((z_1, z_2, z_2^2)\\); this separately instruments the linear and quadratic endogenous terms to address endogeneity in the structural equation.", "Drop \\(y_2^2\\) from the model and estimate \\(y_1 = \\alpha + \\beta_1 y_2 + \\gamma z_1 + u\\) by 2SLS using \\(z_2\\) as the single instrument; the quadratic term is second-order and its omission is inconsequential for consistently identifying the linear effect \\(\\beta_1\\).", "Since \\(y_2^2\\) is correlated with \\(y_2\\), include \\(y_2^2\\) as a control variable in OLS without addressing endogeneity; the coefficient on \\(y_2\\) will be biased only through omitted variable bias from \\(u\\), which is treated as second-order in this approach.", "Use the control function approach: stage 1, regress \\(y_2\\) on \\(z_1, z_2\\) and save residuals \\(\\hat{v}\\); stage 2, include \\(y_2, y_2^2, z_1, \\hat{v}\\) in OLS; t-test on \\(\\hat{v}\\) tests endogeneity; 2SLS using \\(z_2^2\\) for \\(y_2^2\\) is invalid."],
  correct: 3,

{ type: "metrics", topic: "Weak instruments",

{ type: "metrics", topic: "Staggered DiD TWFE failure",

{ type: "metrics", topic: "DiD pre-trend test",
  q: "Pre-period data for \\(\\ell=-3,-2,-1\\) before treatment at \\(\\ell=0\\). How do you test for parallel pre-trends in a DiD setting?",
  opts: ["Compare the mean of \\(Y\\) in the pre-period between treated and control groups; if the pre-period means are equal the groups are broadly comparable, confirming parallel trends; a t-test of pre-period means is the standard diagnostic check.", "Run an event-study regression with indicators for each pre-period lead; test jointly \\(H_0: \\delta_{-3}=\\delta_{-2}=\\delta_{-1}=0\\) using a Wald \\(\\chi^2(3)\\); failure to reject is consistent with parallel trends but cannot rule out violations in the post-period.", "Run a Hausman test comparing the FE and RE panel estimates in the pre-period; a significant Hausman statistic indicates the unit effects are correlated with the treatment indicator, suggesting parallel trends is violated.", "Include \\(Y_{i,t-1}\\) as a control in the DiD regression to absorb pre-existing trends; this eliminates the parallel trends concern by conditioning on the lagged outcome trajectory directly."],

{ type: "metrics", topic: "Fuzzy RDD as IV",
  q: "Running variable \\(X_i\\), cutoff \\(c\\); crossing the cutoff raises \\(P(D=1|X)\\) but does not determine \\(D\\) perfectly. Propose an identification strategy.",

{ type: "metrics", topic: "RDD bandwidth and polynomial",
  q: "Sharp RDD. Discuss the choice of bandwidth and polynomial order for the local regression.",
  opts: ["Use local linear regression (polynomial order 1) within a data-driven bandwidth (e.g., MSE-optimal Imbens-Kalyanaraman or Calonico-Cattaneo-Titiunik); higher-order polynomials may fit better away from \\(c\\) but have poor boundary properties and tend to inflate variance and introduce Runge phenomena near the cutoff.", "Use the full sample with a 4th-degree global polynomial to maximize sample size and fit accuracy; global polynomials provide a smooth parametric approximation to the true conditional expectation function and are thought by some practitioners to give precise estimates of the discontinuous jump at the threshold \\(c\\).", "Use local linear regression (polynomial order 1) within a data-driven bandwidth (e.g., MSE-optimal Imbens-Kalyanaraman or Calonico-Cattaneo-Titiunik); higher-order polynomials fit better away from \\(c\\) but have poor boundary properties and inflate variance; local linear is the preferred method at boundary points.", "Fit a cubic polynomial within the bandwidth; a third-order polynomial is flexible enough to approximate any smooth conditional expectation function near \\(c\\), and its boundary behavior is superior to linear or quadratic fits because it adds two extra degrees of freedom."],
  correct: 2,
  explain: "Local linear regression with an MSE-optimal bandwidth is the consensus recommendation for RDD. <b>Flaw 1:</b> global polynomial RDD is sensitive to observations far from \\(c\\), produces poor boundary estimates, and is discouraged in the RDD literature; identification is local, so only data near \\(c\\) should drive the estimate. <b>Flaw 2:</b> optimizing the bandwidth for first-stage \\(F\\) introduces data-snooping; MSE-optimal bandwidth selection balances bias and variance; a larger bandwidth need not reduce variance if it adds biased observations. <b>Flaw 3:</b> higher-order polynomials have worse boundary properties, not better; at a boundary the highest-degree term has only one-sided support and inflates variance; local linear is theoretically preferred at boundaries. <span class=\"ref\">Guide §4.7</span>"

{ type: "metrics", topic: "Logit AME",
  q: "Logit model \\(P(Y=1|X) = \\Lambda(X'\\beta)\\). A referee requests the marginal effect of \\(x_j\\). What do you report?",
  opts: ["Report \\(\\hat{\\beta}_j\\) directly; it represents the log-odds ratio, which is the natural marginal effect measure in a logit model and requires absolutely no additional post-estimation averaging or any nonlinear numerical computation steps whatsoever to interpret.", "Compute the marginal effect at the mean: \\(\\text{MEM}_j = \\hat{\\beta}_j \\Lambda(\\bar{X}'\\hat{\\beta})(1-\\Lambda(\\bar{X}'\\hat{\\beta}))\\); this evaluates the derivative at the sample mean of \\(X\\) for a representative individual and is the commonly reported quantity.", "Report the LPM coefficient \\(\\hat{\\beta}_j^{LPM}\\) from a linear probability model; logit and LPM give similar predicted probabilities in the interior of \\([0,1]\\) so the LPM coefficient approximates the average marginal effect without nonlinear computation.", "Report the average marginal effect \\(\\text{AME}_j = \\frac{1}{n}\\sum_i \\hat{\\beta}_j \\hat{\\Lambda}_i(1-\\hat{\\Lambda}_i)\\); the raw coefficient \\(\\hat{\\beta}_j\\) is a log-odds ratio; AME averages the individual-level sigmoid slopes over the sample."],

{ type: "metrics", topic: "Cluster level choice",

{ type: "metrics", topic: "FD with omitted time trend",
  q: "Model: \\(y_{it} = \\alpha_i + \\delta t + x_{it}'\\beta + u_{it}\\). First differencing removes \\(\\alpha_i\\). What adjustment is required in the FD regression?",

{ type: "metrics", topic: "Overidentification test",

  opts: ["Test each instrument separately by regressing the 2SLS residuals on \\(z_1\\), \\(z_2\\), \\(z_3\\) individually one at a time; reject any instrument for which the resulting t-statistic exceeds 1.96 in absolute value at the conventional 5% significance level.", "Report the first-stage \\(F\\)-statistic from regressing \\(X\\) on \\(Z\\); \\(F \\gt 10\\) confirms both relevance and exogeneity of the instruments since a strong first stage implies the instruments are properly excluded.", "Regress the 2SLS residuals \\(\\hat{e}\\) on all \\(L=3\\) instruments; the Hansen \\(J\\) statistic is \\(nR^2\\) from this regression; under \\(H_0\\) (all instruments valid), \\(J \\xrightarrow{d} \\chi^2(L) = \\chi^2(3)\\).", "Hansen \\(J\\)-test: regress 2SLS residuals \\(\\hat{e}\\) on all instruments \\(Z\\); form \\(J = nR^2\\); under \\(H_0\\), \\(J \\xrightarrow{d} \\chi^2(L-K) = \\chi^2(2)\\); rejection indicates at least one instrument may be invalid but does not identify which one."],
  correct: 3,
  explain: "The Hansen J-test has \\(L-K\\) degrees of freedom, not \\(L\\). <b>Flaw 1:</b> testing instruments one at a time with individual t-tests does not control FWER; moreover each test conflates the individual instrument's validity with the joint null; the J-test is the correct joint overidentification test. <b>Flaw 2:</b> the first-stage \\(F\\) tests relevance (\\(\\text{Cov}(Z,X) \\ne 0\\)), not exogeneity (\\(E[Ze]=0\\)); a strong first stage says nothing about whether the instruments are excluded from the structural equation. <b>Flaw 3:</b> the J-statistic has \\(L-K = 3-1 = 2\\) degrees of freedom, not \\(L = 3\\); one degree of freedom corresponds to the just-identified component which is not testable; using \\(\\chi^2(3)\\) overstates the critical value and reduces power. <span class=\"ref\">Guide §3.5</span>"

{ type: "metrics", topic: "Driscoll-Kraay vs cluster-robust",

  opts: ["Cluster-robust standard errors at the country level; clustering by country handles within-country serial correlation and heteroskedasticity across all \\(T\\) periods consistently; with 50 clusters the large-sample asymptotic approximation for the cluster-robust sandwich estimator should be adequate.", "White/HC heteroskedasticity-robust standard errors; these are consistent under arbitrary heteroskedasticity across observations and are sufficient since the main concern in cross-country panels is heteroskedastic errors, not serial correlation within units or cross-country dependence from global shocks.", "Use Driscoll-Kraay standard errors; they are consistent for panels with both within-unit serial correlation and cross-sectional dependence across units; country-level cluster-robust SEs assume countries are independent, which fails when global shocks create cross-country correlations.", "Use two-way cluster-robust standard errors clustered by country and by year; two-way clustering addresses within-country and within-year correlation simultaneously and handles global shocks through the year cluster dimension."],

{ type: "metrics", topic: "Probit normalization",
  q: "Binary outcome \\(y\\); latent model \\(y^* = X'\\beta + u\\), \\(y = \\mathbf{1}[y^* \\gt 0]\\), \\(u|X \\sim N(0,\\sigma^2)\\). What is identified and how does probit handle this?",
  opts: ["Both \\(\\beta\\) and \\(\\sigma^2\\) are separately identified from the binary likelihood \\(\\prod_i \\Phi(X_i'\\beta/\\sigma)^{y_i}(1-\\Phi(X_i'\\beta/\\sigma))^{1-y_i}\\) because the likelihood depends on both parameters separately, via the ratio \\(\\beta/\\sigma\\) and via the scale \\(\\sigma\\) in the normal denominator.", "Probit normalizes \\(\\sigma^2 = 1\\) so \\(\\hat{\\beta}\\) directly estimates the structural coefficient under the scale normalization; the marginal effect of \\(x_j\\) therefore equals the raw coefficient \\(\\hat{\\beta}_j\\) and can be read as the change in latent \\(y^*\\) per unit increase in \\(x_j\\) under this normalization.", "Estimate \\(\\sigma\\) by computing residuals from the latent regression \\(\\hat{u}_i = y_i^* - X_i'\\hat{\\beta}\\) and taking their sample standard deviation; plugging this back into the likelihood provides the separate identification of both \\(\\beta\\) and \\(\\sigma\\) needed to recover structural parameters.", "Only \\(\\beta/\\sigma\\) is identified: scaling \\((\\beta, \\sigma)\\) by any constant \\(c \\gt 0\\) leaves \\(P(y=1|X) = \\Phi(X'\\beta/\\sigma)\\) unchanged; probit normalizes \\(\\sigma = 1\\) so what is estimated is \\(\\beta/\\sigma\\), not structural \\(\\beta\\); AME requires multiplying by \\(\\phi(X_i'\\hat{\\beta})\\)."],

function shuffleQuiz() {
  for (let i = quiz.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
  }
}
shuffleQuiz();
let current = 0;
let score = 0;
let answered = false;
const results = [];

function render() {
  const q = quiz[current];
  const card = document.getElementById("card");
  let html = '';
  html += '<div class="card-meta"><span class="tag ' + q.type + '">' + (q.type === "metrics" ? "Econometrics" : "Microeconomics") + '</span><span class="topic-tag">' + q.topic + '</span></div>';
  html += '<div class="question">Q' + (current+1) + '. ' + q.q + '</div>';
  html += '<div class="options">';
  const letters = ['A','B','C','D'];
  for (let i = 0; i < q.opts.length; i++) {
    html += '<button class="opt" id="opt'+i+'" onclick="pick('+i+')"><span class="letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></button>';
  }
  html += '</div>';
  html += '<div class="explain" id="explain">' + q.explain + '</div>';
  card.innerHTML = html;

  answered = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("nextBtn").textContent = current === quiz.length - 1 ? "Finish ✓" : "Next →";
  const pct = (current / quiz.length * 100).toFixed(0);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("topicLabel").textContent = "Question " + (current+1) + " / " + quiz.length;
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([card]);
}

function pick(i) {
  if (answered) return;
  answered = true;
  const q = quiz[current];
  const right = i === q.correct;
  if (right) score++;
  results.push({ topic: q.topic, type: q.type, right: right });
  for (let j = 0; j < q.opts.length; j++) {
    const el = document.getElementById("opt" + j);
    el.disabled = true;
    if (j === q.correct) el.classList.add("correct");
    else if (j === i) el.classList.add("wrong");
    else el.classList.add("dim");
  }
  const ex = document.getElementById("explain");
  ex.classList.add("visible");
  document.getElementById("scoreLabel").textContent = "Score: " + score;
  document.getElementById("nextBtn").disabled = false;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([ex]);
}

function next() {
  if (!answered) return;
  if (current < quiz.length - 1) { current++; render(); }
  else finish();
}

function finish() {
  const card = document.getElementById("card");
  const pctScore = Math.round(score / quiz.length * 100);
  let grade;
  if (pctScore >= 90) grade = "Ace territory. Keep it warm.";
  else if (pctScore >= 75) grade = "Solid — drill the misses below, then re-run.";
  else if (pctScore >= 60) grade = "Passing-adjacent. The misses map to guide sections — restudy those first.";
  else grade = "Back to the guides — Tier 1 sections first, then re-run this quiz.";
  let html = '<div class="bigscore">' + score + ' / ' + quiz.length + '</div>';
  html += '<div class="grade">' + pctScore + '% — ' + grade + '</div>';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    html += '<div class="result-line"><span>Q' + (i+1) + ' · ' + (r.type === "metrics" ? "Metrics" : "Micro") + ' · ' + r.topic + '</span><span class="' + (r.right ? 'ok' : 'miss') + '">' + (r.right ? '✓' : '✗') + '</span></div>';
  }
  html += '<div class="nav" style="margin-top:16px"><button onclick="restart()">↻ Restart quiz</button></div>';
  card.innerHTML = html;
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("topicLabel").textContent = "Done";
  document.getElementById("nextBtn").disabled = true;
}

function restart() {
  shuffleQuiz();
  current = 0; score = 0; answered = false; results.length = 0;
  render();
}

document.addEventListener("keydown", e => {
  if (["1","2","3","4"].includes(e.key) && !answered) { pick(parseInt(e.key)-1); }
  if ((e.key === "Enter" || e.key === "ArrowRight") && answered) next();
});

render();
</script>
</body>
</html>
